<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captain Legends Soccer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      user-select: none;
    }

    h1 {
      font-size: 1.8rem;
      color: #f0c040;
      text-shadow: 0 0 14px #f0c04099;
      margin-bottom: 8px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #hud {
      display: flex;
      align-items: center;
      gap: 0;
      background: #16213e;
      border: 2px solid #f0c040;
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px #f0c04033;
      min-width: 360px;
    }

    .hud-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 20px;
      gap: 2px;
      flex: 1;
    }

    .hud-name { font-size: 0.75rem; color: #aac; letter-spacing: 1px; text-transform: uppercase; }
    .hud-score { font-size: 2.2rem; font-weight: bold; color: #f0c040; line-height: 1; }

    #hud-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 16px;
      border-left: 1px solid #2a3a5e;
      border-right: 1px solid #2a3a5e;
    }

    #timer { font-size: 1.4rem; font-weight: bold; color: #7ecfff; letter-spacing: 2px; }
    #period { font-size: 0.7rem; color: #556; text-transform: uppercase; letter-spacing: 1px; }

    #canvas-wrap {
      position: relative;
      border: 3px solid #f0c040;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 40px #f0c04044;
      cursor: none;
    }

    canvas { display: block; }

    #controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    button {
      background: linear-gradient(135deg, #f0c040, #e0a820);
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      padding: 9px 22px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }
    button:hover { filter: brightness(1.1); transform: scale(1.04); }
    button:active { transform: scale(0.97); }

    #upload-label {
      background: linear-gradient(135deg, #3a8ef6, #2060c0);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 22px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #upload-label:hover { filter: brightness(1.15); transform: scale(1.04); }
    #photo-input { display: none; }

    #photo-preview {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #7ecfff;
      object-fit: cover;
      display: none;
    }

    #instructions {
      margin-top: 10px;
      background: #16213e;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.82rem;
      color: #88a0b8;
      max-width: 640px;
      line-height: 1.8;
      text-align: center;
    }
    #instructions strong { color: #f0c040; }

    #message-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      gap: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #message-overlay.show { opacity: 1; }

    #msg-text {
      font-size: 3rem;
      font-weight: 900;
      color: #f0c040;
      text-shadow: 0 0 30px #f0c040, 0 4px 0 #8a6000;
      letter-spacing: 4px;
      text-transform: uppercase;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }
    #msg-sub {
      font-size: 1.1rem;
      color: #eee;
      letter-spacing: 2px;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.05); }
    }
  </style>
</head>
<body>

<h1>⚽ Captain Legends</h1>

<div id="hud">
  <div class="hud-team">
    <div class="hud-name" id="player-name">YOU</div>
    <div class="hud-score" id="score-player">0</div>
  </div>
  <div id="hud-center">
    <div id="timer">02:00</div>
    <div id="period">1st Half</div>
  </div>
  <div class="hud-team">
    <div class="hud-name">CPU</div>
    <div class="hud-score" id="score-cpu">0</div>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="game" width="640" height="420"></canvas>
  <div id="message-overlay">
    <div id="msg-text"></div>
    <div id="msg-sub"></div>
  </div>
</div>

<div id="controls">
  <label id="upload-label" for="photo-input">
    📷 Upload Your Photo
  </label>
  <input type="file" id="photo-input" accept="image/*" />
  <img id="photo-preview" alt="Your photo" />
  <button id="btn-start">▶ New Game</button>
  <button id="btn-pause">⏸ Pause</button>
</div>

<div id="instructions">
  <strong>Move:</strong> Mouse &nbsp;|&nbsp;
  <strong>Shoot:</strong> Tap Space &nbsp;|&nbsp;
  <strong>Drive Shot:</strong> Hold Space to charge ⚡ → release to fire &nbsp;|&nbsp;
  Score in the <strong>right goal</strong> — defend the left!
</div>

<script>
// ─── Canvas & size ───────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ─── Constants ───────────────────────────────────────────────
const FP      = 22;           // field padding
const GOAL_W  = 14;
const GOAL_H  = 100;
const GOAL_DEPTH = 18;
const PR      = 18;           // player radius (head)
const BR      = 8;            // ball radius
const MATCH_SECS = 2 * 60;   // 2-minute match

// ─── State ───────────────────────────────────────────────────
let gameState    = 'idle';
let playerScore  = 0, cpuScore = 0;
let timeLeft     = MATCH_SECS;
let lastTs       = null;
let goalCooldown = 0;
let shootCD      = 0;
let playerName   = 'YOU';

// Drive shot state
let driveCharging  = false;
let drivePower     = 0;        // 0–1
let driveActive    = false;    // ball is a drive shot in flight
let driveTimer     = 0;
let driveType      = 'none';   // 'drive' | 'neo' | 'miracle'
let spaceReleased  = false;
let ballTrail      = [];       // [{x,y}] for trail effect
let driveMsgTimer  = 0;
// Trajectory curve state
let ballCurlTime   = 0;        // seconds since drive shot fired
let ballCurlDir    = 0;        // +1 or -1 for miracle diagonal sweep direction

// Drive shot tiers
const TIER_DRIVE   = 0.40;    // blue fire drive shot
const TIER_NEO     = 0.72;    // electric blue neo-drive
const TIER_MIRACLE = 1.00;    // white/gold miracle drive

// ─── Player photo ────────────────────────────────────────────
let playerPhoto = null;  // HTMLImageElement once loaded
let cpuPhoto    = null;  // we generate a CPU face on an offscreen canvas

// Mouse
const mouse = { x: W / 2, y: H / 2 };
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mouseleave', () => { /* keep last pos */ });

// Keys
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space') spaceReleased = true;
});

// ─── Entities ────────────────────────────────────────────────
let player, cpu, ball;

function makePlayer() {
  return {
    x: W * 0.25, y: H / 2,
    vx: 0, vy: 0,
    speed: 210,
    legPhase: 0,
    team: 0,
    hasBall: false,
  };
}

function makeCPU() {
  return {
    x: W * 0.75, y: H / 2,
    vx: 0, vy: 0,
    speed: 170,
    legPhase: 0,
    team: 1,
    hasBall: false,
    shootCD: 0,
    thinkTimer: 0,
    targetX: W * 0.75,
    targetY: H / 2,
  };
}

function makeBall() {
  return { x: W / 2, y: H / 2, vx: 0, vy: 0, owner: null };
}

function initGame() {
  player = makePlayer();
  cpu    = makeCPU();
  ball   = makeBall();
  playerScore = cpuScore = 0;
  timeLeft    = MATCH_SECS;
  goalCooldown = shootCD = 0;
  driveCharging = false; drivePower = 0; driveActive = false; driveTimer = 0; driveType = 'none';
  spaceReleased = false; ballTrail = []; driveMsgTimer = 0;
  ballCurlTime = 0; ballCurlDir = 0;
  updateHUD();
  hideMessage();
  gameState = 'playing';
}

// ─── CPU face generator ──────────────────────────────────────
function generateCPUFace() {
  const sz = 64;
  const oc = document.createElement('canvas');
  oc.width = oc.height = sz;
  const ox = oc.getContext('2d');
  // skin
  ox.fillStyle = '#c8845a';
  ox.beginPath(); ox.arc(sz/2, sz/2, sz/2 - 2, 0, Math.PI*2); ox.fill();
  // eyes
  ox.fillStyle = '#222';
  ox.beginPath(); ox.arc(20, 26, 4, 0, Math.PI*2); ox.fill();
  ox.beginPath(); ox.arc(44, 26, 4, 0, Math.PI*2); ox.fill();
  ox.fillStyle = '#fff';
  ox.beginPath(); ox.arc(21, 25, 1.5, 0, Math.PI*2); ox.fill();
  ox.beginPath(); ox.arc(45, 25, 1.5, 0, Math.PI*2); ox.fill();
  // angry brows
  ox.strokeStyle = '#333'; ox.lineWidth = 3; ox.lineCap = 'round';
  ox.beginPath(); ox.moveTo(14, 20); ox.lineTo(28, 22); ox.stroke();
  ox.beginPath(); ox.moveTo(50, 20); ox.lineTo(36, 22); ox.stroke();
  // mouth (smirk)
  ox.beginPath(); ox.moveTo(24, 42); ox.quadraticCurveTo(32, 46, 40, 42); ox.stroke();
  // hair
  ox.fillStyle = '#3a2010';
  ox.beginPath(); ox.arc(sz/2, 16, 18, Math.PI, 0); ox.fill();
  const img = new Image();
  img.src = oc.toDataURL();
  return img;
}

// ─── Photo upload ────────────────────────────────────────────
document.getElementById('photo-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      playerPhoto = img;
      const prev = document.getElementById('photo-preview');
      prev.src = ev.target.result;
      prev.style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// ─── HUD ─────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('score-player').textContent = playerScore;
  document.getElementById('score-cpu').textContent    = cpuScore;
  const m = Math.floor(timeLeft / 60);
  const s = Math.floor(timeLeft % 60);
  document.getElementById('timer').textContent =
    `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ─── Buttons ─────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => {
  initGame();
  lastTs = null;
  requestAnimationFrame(loop);
});
document.getElementById('btn-pause').addEventListener('click', () => {
  if (gameState === 'playing') {
    gameState = 'paused'; showMessage('PAUSED', 'Click Pause to resume');
  } else if (gameState === 'paused') {
    gameState = 'playing'; hideMessage(); lastTs = null; requestAnimationFrame(loop);
  }
});

// ─── Helpers ─────────────────────────────────────────────────
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function norm2(dx, dy) {
  const m = Math.hypot(dx, dy);
  return m > 0 ? [dx/m, dy/m] : [0, 0];
}

// ─── Update ──────────────────────────────────────────────────
const FRICTION   = 0.978;
const KICK_PWR   = 500;
const CTRL_RANGE = PR + BR + 4;
const TACKLE_RNG = 32;

function update(dt) {
  if (shootCD  > 0) shootCD  -= dt;
  if (goalCooldown > 0) { goalCooldown -= dt; return; }
  if (driveTimer > 0) { driveTimer -= dt; if (driveTimer <= 0) { driveActive = false; driveType = 'none'; } }
  if (driveMsgTimer > 0) driveMsgTimer -= dt;

  // Ball trail for drive shot
  if (driveActive && !ball.owner) {
    ballTrail.push({ x: ball.x, y: ball.y });
    if (ballTrail.length > 18) ballTrail.shift();
  } else if (!driveActive) {
    ballTrail = [];
  }

  // ── Player movement (follow mouse) ──
  const pdx = mouse.x - player.x, pdy = mouse.y - player.y;
  const pd  = Math.hypot(pdx, pdy);
  if (pd > 2) {
    const [nx, ny] = norm2(pdx, pdy);
    const spd = Math.min(player.speed, pd / dt); // don't overshoot
    player.vx = nx * Math.min(player.speed, pd * 8);
    player.vy = ny * Math.min(player.speed, pd * 8);
  } else {
    player.vx *= 0.7; player.vy *= 0.7;
  }

  // Move player
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x  = clamp(player.x, FP + PR, W - FP - PR);
  player.y  = clamp(player.y, FP + PR, H - FP - PR);
  player.legPhase += Math.hypot(player.vx, player.vy) * dt * 0.08;

  // ── Drive shot charging (hold Space while owning ball) ──
  if (keys['Space'] && ball.owner === player) {
    driveCharging = true;
    drivePower = Math.min(1, drivePower + dt / 1.4);
  }

  // ── Tackle (immediate, regardless of charging) ──
  if (keys['Space'] && ball.owner === cpu && dist(player, ball) < TACKLE_RNG && shootCD <= 0) {
    ball.owner = null; cpu.hasBall = false;
    const [nx, ny] = norm2(player.x - cpu.x, player.y - cpu.y);
    ball.vx = nx * 200; ball.vy = ny * 200;
    shootCD = 0.5;
    driveCharging = false; drivePower = 0;
  }

  // ── Fire on Space release ──
  if (spaceReleased) {
    if (driveCharging && ball.owner === player && shootCD <= 0) {
      const gx = W - FP;

      // Determine tier
      let power, shotDuration;
      if (drivePower >= TIER_MIRACLE) {
        driveType    = 'miracle';
        power        = KICK_PWR * 3.8;
        shotDuration = 2.4;
      } else if (drivePower >= TIER_NEO) {
        driveType    = 'neo';
        power        = KICK_PWR * 2.6;
        shotDuration = 2.0;
      } else if (drivePower >= TIER_DRIVE) {
        driveType    = 'drive';
        power        = KICK_PWR * (0.7 + drivePower * 2.2);
        shotDuration = 1.8;
      } else {
        driveType    = 'none';
        power        = KICK_PWR * (0.7 + drivePower * 1.2);
        shotDuration = 0;
      }

      // Aim: miracle aims at entry corner; others aim at goal center ± spread
      let gy;
      if (driveType === 'miracle') {
        // curl dir: if upper half → sweep starts up (negative), entry from top
        ballCurlDir = player.y < H / 2 ? -1 : 1;
        // initial aim toward entry corner so the path is a true diagonal
        gy = H / 2 - ballCurlDir * GOAL_H * 0.38;
      } else {
        const spread = (1 - drivePower) * 60;
        gy = H / 2 + (Math.random() - 0.5) * spread;
      }

      const [nx, ny] = norm2(gx - player.x, gy - player.y);
      ball.vx = nx * power + player.vx * 0.3;
      ball.vy = ny * power + player.vy * 0.3;
      ball.owner = null;
      player.hasBall = false;
      shootCD = 0.4;

      if (driveType !== 'none') {
        driveActive   = true;
        driveTimer    = shotDuration;
        driveMsgTimer = 1.4;
        ballTrail     = [];
        ballCurlTime  = 0;
        // Arc: give drive/neo an upward boost; gravity applied continuously below
        if (driveType === 'drive') ball.vy -= 240;
        if (driveType === 'neo')   ball.vy -= 310;
      }
    }
    driveCharging = false;
    drivePower = 0;
    spaceReleased = false;
  }

  // ── CPU AI ──
  updateCPU(dt);

  // ── Ball physics ──
  if (!ball.owner) {
    // Drive-shot trajectory forces (applied before friction/movement)
    if (driveActive) {
      ballCurlTime += dt;
      if (driveType === 'drive') {
        // Arc: downward pull brings ball back after initial upward boost
        ball.vy += 480 * dt;
      } else if (driveType === 'neo') {
        // Stronger arc gravity for neo
        ball.vy += 600 * dt;
      } else if (driveType === 'miracle') {
        // Diagonal sweep: cosine force that curves ball across the goal mouth
        // cos goes 1→0→-1 over MIRACLE_CURL_DUR seconds → one full sweep direction change
        const MIRACLE_CURL_DUR = 1.0;
        const t = Math.min(1, ballCurlTime / MIRACLE_CURL_DUR);
        ball.vy += ballCurlDir * 900 * Math.cos(t * Math.PI) * dt;
      }
    }

    ball.vx *= FRICTION; ball.vy *= FRICTION;
    ball.x  += ball.vx * dt; ball.y  += ball.vy * dt;

    // Top / bottom bounce
    if (ball.y < FP + BR) { ball.y = FP + BR; ball.vy =  Math.abs(ball.vy); }
    if (ball.y > H-FP-BR) { ball.y = H-FP-BR; ball.vy = -Math.abs(ball.vy); }

    const gTop    = H/2 - GOAL_H/2;
    const gBottom = H/2 + GOAL_H/2;

    // Left wall / goal (CPU scores — player defends left)
    if (ball.x < FP + BR) {
      if (ball.y >= gTop && ball.y <= gBottom) {
        triggerGoal(1); return;   // cpu scored
      }
      ball.x = FP + BR; ball.vx = Math.abs(ball.vx);
    }
    // Right wall / goal (Player scores — attack right)
    if (ball.x > W - FP - BR) {
      if (ball.y >= gTop && ball.y <= gBottom) {
        triggerGoal(0); return;   // player scored
      }
      ball.x = W-FP-BR; ball.vx = -Math.abs(ball.vx);
    }

    // Pickup
    [player, cpu].forEach(p => {
      if (ball.owner) return;
      if (dist(p, ball) < CTRL_RANGE) {
        ball.owner = p; p.hasBall = true;
        ball.vx = 0; ball.vy = 0;
      }
    });
  } else {
    // Dribble: ball hugs front of owner
    const ownVLen = Math.hypot(ball.owner.vx, ball.owner.vy);
    const [fnx, fny] = ownVLen > 10
      ? norm2(ball.owner.vx, ball.owner.vy)
      : [ball.owner.team === 0 ? 1 : -1, 0];
    ball.x = ball.owner.x + fnx * (PR + BR + 2);
    ball.y = ball.owner.y + fny * (PR + BR + 2);
  }
}

// ─── CPU AI ──────────────────────────────────────────────────
function updateCPU(dt) {
  cpu.shootCD  = (cpu.shootCD  || 0) - dt;
  cpu.thinkTimer -= dt;

  if (ball.owner === cpu) {
    // Dribble toward player's goal (left)
    const goalX = FP + GOAL_DEPTH;
    const [nx, ny] = norm2(goalX - cpu.x, H/2 - cpu.y);
    cpu.vx = nx * cpu.speed;
    cpu.vy = ny * cpu.speed;

    // Shoot when in range
    if (cpu.x < W * 0.55 && cpu.shootCD <= 0) {
      const gx = FP;
      const gy = H/2 + (Math.random() - 0.5) * 50;
      const [gnx, gny] = norm2(gx - cpu.x, gy - cpu.y);
      ball.vx = gnx * KICK_PWR * 0.88;
      ball.vy = gny * KICK_PWR * 0.88;
      ball.owner = null; cpu.hasBall = false;
      cpu.shootCD = 1.2;
    }
    // Tackle player if close
    if (ball.owner === player && dist(cpu, player) < TACKLE_RNG + 4 && cpu.shootCD <= 0) {
      ball.owner = null; player.hasBall = false;
      const [nx2, ny2] = norm2(cpu.x - player.x, cpu.y - player.y);
      ball.vx = nx2 * 180; ball.vy = ny2 * 180;
      cpu.shootCD = 0.8;
    }
  } else {
    // Chase ball or get into position
    let tx = ball.x, ty = ball.y;
    if (ball.owner === player) {
      // Press aggressively
      tx = player.x; ty = player.y;
    }
    const [nx, ny] = norm2(tx - cpu.x, ty - cpu.y);
    cpu.vx = nx * cpu.speed;
    cpu.vy = ny * cpu.speed;

    // Tackle
    if (ball.owner === player && dist(cpu, player) < TACKLE_RNG && (cpu.shootCD || 0) <= 0) {
      ball.owner = null; player.hasBall = false;
      const [nx2, ny2] = norm2(cpu.x - player.x, cpu.y - player.y);
      ball.vx = nx2 * 220; ball.vy = ny2 * 220;
      cpu.shootCD = 0.9;
    }
  }

  cpu.x += cpu.vx * dt;
  cpu.y += cpu.vy * dt;
  cpu.x  = clamp(cpu.x, FP + PR, W - FP - PR);
  cpu.y  = clamp(cpu.y, FP + PR, H - FP - PR);
  cpu.legPhase += Math.hypot(cpu.vx, cpu.vy) * dt * 0.08;
}

// ─── Goals ───────────────────────────────────────────────────
function triggerGoal(scoringTeam) {
  if (goalCooldown > 0) return;
  if (scoringTeam === 0) { playerScore++; showMessage('GOAL!', 'You scored! 🎉'); }
  else                   { cpuScore++;    showMessage('GOAL!', 'CPU scored!');     }
  updateHUD();
  goalCooldown = 2.5;
  gameState = 'goal';
  setTimeout(() => {
    player = makePlayer(); cpu = makeCPU(); ball = makeBall();
    goalCooldown = 0;
    hideMessage();
    gameState = 'playing';
  }, 2500);
}

// ─── Drawing ─────────────────────────────────────────────────
function drawField() {
  // Base grass
  ctx.fillStyle = '#2e7d32';
  ctx.fillRect(0, 0, W, H);

  // Alternating stripes
  for (let i = 0; i < 8; i++) {
    const x = FP + i * ((W - FP*2) / 8);
    if (i % 2 === 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.07)';
      ctx.fillRect(x, FP, (W - FP*2) / 8, H - FP*2);
    }
  }

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth   = 2;

  // Boundary
  ctx.strokeRect(FP, FP, W - FP*2, H - FP*2);

  // Center line
  ctx.beginPath(); ctx.moveTo(W/2, FP); ctx.lineTo(W/2, H - FP); ctx.stroke();

  // Center circle
  ctx.beginPath(); ctx.arc(W/2, H/2, 52, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(W/2, H/2, 3, 0, Math.PI*2); ctx.fill();

  // Penalty areas
  const pw = 95, ph = 170;
  ctx.strokeRect(FP, H/2 - ph/2, pw, ph);
  ctx.strokeRect(W - FP - pw, H/2 - ph/2, pw, ph);

  // Goal areas
  const gaw = 44, gah = 110;
  ctx.strokeRect(FP, H/2 - gah/2, gaw, gah);
  ctx.strokeRect(W - FP - gaw, H/2 - gah/2, gaw, gah);

  // Penalty spots
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(FP + 72, H/2, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W - FP - 72, H/2, 3, 0, Math.PI*2); ctx.fill();

  // Corner arcs
  const corners = [[FP, FP], [W-FP, FP], [FP, H-FP], [W-FP, H-FP]];
  const angles  = [[0, Math.PI/2], [Math.PI/2, Math.PI], [Math.PI*1.5, Math.PI*2], [Math.PI, Math.PI*1.5]];
  corners.forEach(([cx, cy], i) => {
    ctx.beginPath(); ctx.arc(cx, cy, 10, angles[i][0], angles[i][1]); ctx.stroke();
  });

  ctx.restore();

  // Goals (nets)
  const gTop = H/2 - GOAL_H/2, gBot = H/2 + GOAL_H/2;

  // Left goal
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(FP - GOAL_DEPTH, gTop, GOAL_DEPTH, GOAL_H);
  drawGoalPosts(FP, gTop, gBot, 'left');

  // Right goal
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(W - FP, gTop, GOAL_DEPTH, GOAL_H);
  drawGoalPosts(W - FP, gTop, gBot, 'right');

  // Net lines
  drawNet(FP - GOAL_DEPTH, gTop, GOAL_DEPTH, GOAL_H);
  drawNet(W - FP, gTop, GOAL_DEPTH, GOAL_H);
}

function drawGoalPosts(x, top, bot, side) {
  ctx.save();
  ctx.strokeStyle = '#eee';
  ctx.lineWidth   = 4;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.lineTo(x + (side === 'left' ? -GOAL_DEPTH : GOAL_DEPTH), top);
  ctx.lineTo(x + (side === 'left' ? -GOAL_DEPTH : GOAL_DEPTH), bot);
  ctx.lineTo(x, bot);
  ctx.stroke();
  ctx.restore();
}

function drawNet(x, y, nw, nh) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  const step = 10;
  for (let dy = 0; dy <= nh; dy += step) {
    ctx.beginPath(); ctx.moveTo(x, y + dy); ctx.lineTo(x + nw, y + dy); ctx.stroke();
  }
  for (let dx = 0; dx <= nw; dx += step) {
    ctx.beginPath(); ctx.moveTo(x + dx, y); ctx.lineTo(x + dx, y + nh); ctx.stroke();
  }
  ctx.restore();
}

// ─── Character drawing ───────────────────────────────────────
function drawCharacter(p, photo, jerseyColor, isPlayer) {
  const x = p.x, y = p.y;
  const moving = Math.hypot(p.vx, p.vy) > 20;
  const phase  = p.legPhase || 0;
  const leg1   = moving ? Math.sin(phase) * 10 : 0;
  const leg2   = moving ? Math.sin(phase + Math.PI) * 10 : 0;

  ctx.save();

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(x, y + PR + 14, PR * 0.85, 7, 0, 0, Math.PI*2);
  ctx.fill();

  // ── Legs ──
  const legW = 7, legH = 22;
  const legY = y + PR + 2;

  // Left leg
  ctx.save();
  ctx.translate(x - 6, legY);
  ctx.rotate(leg1 * 0.06);
  ctx.fillStyle = isPlayer ? '#1a3a7a' : '#7a1a1a';
  ctx.beginPath();
  ctx.roundRect(-legW/2, 0, legW, legH, 3);
  ctx.fill();
  // Shoe
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.ellipse(0, legH + 3, legW * 0.8, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Right leg
  ctx.save();
  ctx.translate(x + 6, legY);
  ctx.rotate(leg2 * 0.06);
  ctx.fillStyle = isPlayer ? '#1a3a7a' : '#7a1a1a';
  ctx.beginPath();
  ctx.roundRect(-legW/2, 0, legW, legH, 3);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.ellipse(0, legH + 3, legW * 0.8, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // ── Jersey / body ──
  const bodyW = PR * 1.8, bodyH = PR * 1.6;
  const bodyY = y - PR * 0.2;

  ctx.fillStyle = jerseyColor;
  ctx.beginPath();
  ctx.roundRect(x - bodyW/2, bodyY, bodyW, bodyH, 6);
  ctx.fill();

  // Jersey number
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(isPlayer ? '10' : '1', x, bodyY + bodyH * 0.5);

  // Jersey collar
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.arc(x, bodyY + 3, 5, 0, Math.PI*2);
  ctx.fill();

  // ── Arms ──
  const armSwing = moving ? Math.sin(phase + Math.PI * 0.5) * 8 : 0;
  ctx.strokeStyle = jerseyColor;
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';

  // Left arm
  ctx.beginPath();
  ctx.moveTo(x - bodyW/2 + 2, bodyY + 6);
  ctx.lineTo(x - bodyW/2 - 8, bodyY + bodyH * 0.5 + armSwing);
  ctx.stroke();

  // Right arm
  ctx.beginPath();
  ctx.moveTo(x + bodyW/2 - 2, bodyY + 6);
  ctx.lineTo(x + bodyW/2 + 8, bodyY + bodyH * 0.5 - armSwing);
  ctx.stroke();

  // ── Head ──
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, PR, 0, Math.PI*2);
  ctx.clip();

  if (photo && photo.complete && photo.naturalWidth > 0) {
    // Draw uploaded photo cropped to circle
    const s = PR * 2;
    ctx.drawImage(photo, x - PR, y - PR, s, s);
  } else {
    // Default face
    ctx.fillStyle = isPlayer ? '#f0c080' : '#c8845a';
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(x - 5, y - 3, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 5, y - 3, 3, 0, Math.PI*2); ctx.fill();

    // Mouth
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    if (isPlayer) {
      ctx.beginPath();
      ctx.moveTo(x - 5, y + 5); ctx.quadraticCurveTo(x, y + 9, x + 5, y + 5);
      ctx.stroke();
    } else {
      // CPU scowl
      ctx.beginPath();
      ctx.moveTo(x - 6, y + 7); ctx.quadraticCurveTo(x, y + 4, x + 6, y + 7);
      ctx.stroke();
    }

    // Hair
    ctx.fillStyle = isPlayer ? '#5a3010' : '#1a1a1a';
    ctx.beginPath();
    ctx.arc(x, y - PR * 0.3, PR * 0.75, Math.PI, 0);
    ctx.fill();
  }
  ctx.restore();

  // Head border / outline
  ctx.beginPath();
  ctx.arc(x, y, PR, 0, Math.PI*2);
  ctx.strokeStyle = isPlayer ? '#7ecfff' : '#ff8888';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Selection glow for player
  if (isPlayer) {
    ctx.beginPath();
    ctx.arc(x, y, PR + 6, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(126,207,255,0.35)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Ball possession indicator
  if (p.hasBall || ball.owner === p) {
    ctx.fillStyle = '#f0c040';
    ctx.beginPath();
    ctx.arc(x, y - PR - 9, 5, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

// Per-tier visual config
function driveVisuals() {
  if (driveType === 'miracle') return {
    trailInner:  (t) => `rgba(255,255,${Math.floor(180*t)},${t * 0.9})`,
    trailOuter:  (t) => `rgba(${Math.floor(200+55*t)},${Math.floor(150*t)},255,${t * 0.5})`,
    glowInner:   'rgba(255,255,200,0.9)',
    glowOuter:   'rgba(180,80,255,0)',
    glowRadius:  28,
    ballTop:     '#ffffff',
    ballBot:     '#ffe566',
    patchColor:  '#cc8800',
    rimColor:    '#ffe566',
    rimWidth:    3,
  };
  if (driveType === 'neo') return {
    trailInner:  (t) => `rgba(${Math.floor(60*t)},${Math.floor(100*t)},255,${t * 0.85})`,
    trailOuter:  (t) => `rgba(140,${Math.floor(40*t)},255,${t * 0.5})`,
    glowInner:   'rgba(100,140,255,0.75)',
    glowOuter:   'rgba(80,0,255,0)',
    glowRadius:  22,
    ballTop:     '#d0e8ff',
    ballBot:     '#0044ff',
    patchColor:  '#002288',
    rimColor:    '#88aaff',
    rimWidth:    2.5,
  };
  // drive (blue fire)
  return {
    trailInner:  (t) => `rgba(${Math.floor(30*t)},${Math.floor(140*t)},255,${t * 0.75})`,
    trailOuter:  (t) => `rgba(0,80,200,${t * 0.4})`,
    glowInner:   'rgba(50,160,255,0.6)',
    glowOuter:   'rgba(0,60,200,0)',
    glowRadius:  18,
    ballTop:     '#e0f0ff',
    ballBot:     '#0088ff',
    patchColor:  '#004499',
    rimColor:    '#44aaff',
    rimWidth:    2,
  };
}

function drawBall() {
  const bx = ball.x, by = ball.y;

  if (driveActive && ballTrail.length > 1) {
    const v = driveVisuals();
    // Double-layer trail: outer soft halo + inner core
    for (let i = 1; i < ballTrail.length; i++) {
      const t = i / ballTrail.length;
      const r = BR * t * 1.1;
      // outer halo
      ctx.beginPath();
      ctx.arc(ballTrail[i].x, ballTrail[i].y, r * 1.6, 0, Math.PI*2);
      ctx.fillStyle = v.trailOuter(t);
      ctx.fill();
      // inner core
      ctx.beginPath();
      ctx.arc(ballTrail[i].x, ballTrail[i].y, r, 0, Math.PI*2);
      ctx.fillStyle = v.trailInner(t);
      ctx.fill();
    }

    // Miracle gets extra sparkle particles along trail
    if (driveType === 'miracle') {
      for (let i = 2; i < ballTrail.length; i += 3) {
        const t = i / ballTrail.length;
        const ang = (Date.now() / 80 + i * 1.3) % (Math.PI * 2);
        const px = ballTrail[i].x + Math.cos(ang) * BR * 1.2;
        const py = ballTrail[i].y + Math.sin(ang) * BR * 1.2;
        ctx.beginPath(); ctx.arc(px, py, 2.5 * t, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,240,100,${t * 0.9})`;
        ctx.fill();
      }
    }

    // Outer glow at ball position
    const glow = ctx.createRadialGradient(bx, by, BR, bx, by, BR + v.glowRadius);
    glow.addColorStop(0, v.glowInner);
    glow.addColorStop(1, v.glowOuter);
    ctx.beginPath(); ctx.arc(bx, by, BR + v.glowRadius, 0, Math.PI*2);
    ctx.fillStyle = glow; ctx.fill();

    // Neo gets an electric ring pulse
    if (driveType === 'neo') {
      const ring = BR + 6 + 4 * Math.sin(Date.now() / 50);
      ctx.beginPath(); ctx.arc(bx, by, ring, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(100,180,255,0.6)`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Miracle gets a rotating star corona
    if (driveType === 'miracle') {
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(Date.now() / 200);
      for (let s = 0; s < 6; s++) {
        ctx.rotate(Math.PI / 3);
        ctx.beginPath();
        ctx.moveTo(0, BR + 4);
        ctx.lineTo(2, BR + 14);
        ctx.lineTo(-2, BR + 14);
        ctx.closePath();
        ctx.fillStyle = `rgba(255,230,80,0.7)`;
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(bx, by + BR + 4, BR * 0.85, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // Main ball
  ctx.beginPath();
  ctx.arc(bx, by, BR, 0, Math.PI*2);
  const g = ctx.createRadialGradient(bx - 2, by - 2, 1, bx, by, BR);
  if (driveActive) {
    const v = driveVisuals();
    g.addColorStop(0, v.ballTop);
    g.addColorStop(1, v.ballBot);
  } else {
    g.addColorStop(0, '#fff');
    g.addColorStop(1, '#ccc');
  }
  ctx.fillStyle = g;
  ctx.fill();

  // Patches
  if (driveActive) {
    const v = driveVisuals();
    ctx.fillStyle = v.patchColor;
    drawSoccerBallPatches(bx, by, BR);
    ctx.strokeStyle = v.rimColor;
    ctx.lineWidth = v.rimWidth;
  } else {
    ctx.fillStyle = '#222';
    drawSoccerBallPatches(bx, by, BR);
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
  }
  ctx.beginPath(); ctx.arc(bx, by, BR, 0, Math.PI*2); ctx.stroke();
}

function drawSoccerBallPatches(cx, cy, r) {
  // Draw simplified pentagon pattern
  const spots = [
    [0, 0, 3.5],
    [-r*0.45, -r*0.35, 2.2],
    [r*0.45, -r*0.35, 2.2],
    [-r*0.28, r*0.42, 2.2],
    [r*0.28, r*0.42, 2.2],
  ];
  spots.forEach(([dx, dy, sr]) => {
    ctx.beginPath();
    ctx.arc(cx + dx, cy + dy, sr, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawPowerBar() {
  if (!driveCharging && drivePower === 0) return;
  const bw = 70, bh = 10;
  const bx = player.x - bw / 2;
  const by = player.y - PR - 26;

  // Background track
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.beginPath(); ctx.roundRect(bx - 2, by - 2, bw + 4, bh + 4, 5); ctx.fill();

  // Tier zone markers (faint dividers)
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  [TIER_DRIVE, TIER_NEO].forEach(t => {
    const mx = bx + bw * t;
    ctx.beginPath(); ctx.moveTo(mx, by); ctx.lineTo(mx, by + bh); ctx.stroke();
  });
  ctx.restore();

  // Filled bar — gradient by tier
  const filled = bw * drivePower;
  if (filled > 0) {
    const barGrad = ctx.createLinearGradient(bx, by, bx + bw, by);
    barGrad.addColorStop(0,           '#2288ff');   // drive tier — blue
    barGrad.addColorStop(TIER_NEO,    '#8833ff');   // neo tier — purple-blue
    barGrad.addColorStop(TIER_MIRACLE,'#ffe566');   // miracle — gold
    ctx.fillStyle = barGrad;
    ctx.beginPath(); ctx.roundRect(bx, by, filled, bh, 3); ctx.fill();
  }

  // Miracle flash overlay
  if (drivePower >= TIER_MIRACLE) {
    const flash = 0.35 + 0.35 * Math.sin(Date.now() / 60);
    ctx.fillStyle = `rgba(255,255,200,${flash})`;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 3); ctx.fill();
  }

  // Border
  const borderFlash = drivePower >= TIER_MIRACLE
    ? `rgba(255,230,100,${0.6 + 0.4 * Math.sin(Date.now() / 70)})`
    : drivePower >= TIER_NEO ? 'rgba(150,80,255,0.8)'
    : drivePower >= TIER_DRIVE ? 'rgba(50,160,255,0.7)'
    : 'rgba(255,255,255,0.3)';
  ctx.strokeStyle = borderFlash;
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 3); ctx.stroke();

  // Label
  const label = drivePower >= TIER_MIRACLE ? '✦ MIRACLE ✦'
              : drivePower >= TIER_NEO     ? '⚡ NEO-DRIVE'
              : drivePower >= TIER_DRIVE   ? '🔵 DRIVE'
              : 'CHARGE';
  const labelColor = drivePower >= TIER_MIRACLE ? '#ffe566'
                   : drivePower >= TIER_NEO     ? '#cc88ff'
                   : drivePower >= TIER_DRIVE   ? '#66ccff'
                   : '#aaa';
  ctx.fillStyle = labelColor;
  ctx.font = `bold 9px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(label, player.x, by - 3);
}

function drawDriveMessage() {
  if (driveMsgTimer <= 0) return;
  const alpha = Math.min(1, driveMsgTimer * 2);
  const scale = 1 + (1.4 - Math.min(driveMsgTimer, 1.4)) * 0.35;

  let text, fillColor, shadowColor, fontSize;
  if (driveType === 'miracle') {
    text = '✦ MIRACLE DRIVE ✦';
    fillColor   = '#ffe566';
    shadowColor = '#ff88ff';
    fontSize    = 32;
  } else if (driveType === 'neo') {
    text = '⚡ NEO-DRIVE SHOT!';
    fillColor   = '#88ccff';
    shadowColor = '#4400ff';
    fontSize    = 34;
  } else {
    text = '🔵 DRIVE SHOT!';
    fillColor   = '#44aaff';
    shadowColor = '#0044cc';
    fontSize    = 36;
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2 - 60);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${fontSize}px Segoe UI, sans-serif`;
  ctx.fillStyle   = fillColor;
  ctx.shadowColor = shadowColor;
  ctx.shadowBlur  = driveType === 'miracle' ? 32 : 20;
  ctx.fillText(text, 0, 0);

  // Miracle: extra shimmer line below
  if (driveType === 'miracle') {
    ctx.font = 'bold 14px Segoe UI, sans-serif';
    ctx.fillStyle = `rgba(255,220,100,${alpha * 0.8})`;
    ctx.shadowBlur = 10;
    ctx.fillText('UNSTOPPABLE', 0, 36);
  }
  ctx.restore();
}

// Custom cursor (crosshair where mouse is)
function drawCursor() {
  const mx = mouse.x, my = mouse.y;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.5;
  const sz = 8;
  ctx.beginPath(); ctx.moveTo(mx - sz, my); ctx.lineTo(mx + sz, my); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx, my - sz); ctx.lineTo(mx, my + sz); ctx.stroke();
  ctx.beginPath(); ctx.arc(mx, my, 4, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function render() {
  drawField();
  drawCharacter(player, playerPhoto, '#1565c0', true);
  drawCharacter(cpu, cpuPhoto, '#b71c1c', false);
  drawBall();
  drawPowerBar();
  drawDriveMessage();
  drawCursor();
}

// ─── Messages ────────────────────────────────────────────────
function showMessage(t, s) {
  document.getElementById('msg-text').textContent = t;
  document.getElementById('msg-sub').textContent  = s;
  document.getElementById('message-overlay').classList.add('show');
}
function hideMessage() {
  document.getElementById('message-overlay').classList.remove('show');
}

// ─── Game loop ───────────────────────────────────────────────
function loop(ts) {
  if (gameState !== 'playing' && gameState !== 'goal') return;
  if (!lastTs) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;

  if (gameState === 'playing') {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; updateHUD(); endGame(); render(); return; }
    updateHUD();
    update(dt);
  }

  render();
  requestAnimationFrame(loop);
}

function endGame() {
  gameState = 'end';
  const msg = playerScore > cpuScore ? 'YOU WIN! 🏆'
            : playerScore < cpuScore ? 'CPU WINS'
            : 'DRAW!';
  showMessage(msg, `Final Score: ${playerScore} – ${cpuScore}`);
}

// ─── Boot ─────────────────────────────────────────────────────
cpuPhoto = generateCPUFace();

// Idle screen
(function idleScreen() {
  ctx.fillStyle = '#2e7d32'; ctx.fillRect(0, 0, W, H);
  drawField();
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f0c040';
  ctx.font = 'bold 28px Segoe UI, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Click ▶ New Game to Kick Off!', W/2, H/2 - 14);
  ctx.fillStyle = '#aac';
  ctx.font = '14px Segoe UI, sans-serif';
  ctx.fillText('Upload your photo to play as yourself', W/2, H/2 + 22);
})();
