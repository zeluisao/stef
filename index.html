<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA Blind Bag Collector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #1a3a6b 50%, #0d2044 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 28px 16px 12px;
    }
    header h1 {
      font-size: clamp(2rem, 6vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffd700, #ffaa00, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 2px 8px rgba(255,215,0,0.4));
    }
    header p {
      color: #aac4f0;
      font-size: 1.05rem;
      margin-top: 6px;
    }

    /* ── Counter bar ── */
    #counter-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      padding: 14px 20px;
      background: rgba(255,255,255,0.06);
      border-top: 1px solid rgba(255,215,0,0.2);
      border-bottom: 1px solid rgba(255,215,0,0.2);
    }
    #counter-text {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffd700;
    }
    #progress-bar-wrap {
      width: min(300px, 50vw);
      height: 12px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00e676, #ffd700);
      border-radius: 999px;
      transition: width 0.6s cubic-bezier(.4,2,.6,1);
      width: 0%;
    }

    /* ── Main stage ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    /* ── Open bag section ── */
    #bag-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-bottom: 36px;
    }

    #open-btn {
      position: relative;
      padding: 20px 52px;
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
      color: #0a1628;
      box-shadow: 0 0 30px rgba(255,180,0,0.5), 0 6px 20px rgba(0,0,0,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      overflow: hidden;
    }
    #open-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%);
      border-radius: inherit;
    }
    #open-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(255,180,0,0.7), 0 8px 28px rgba(0,0,0,0.5); }
    #open-btn:active { transform: scale(0.97); }
    #open-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Bag animation area ── */
    #bag-stage {
      width: 180px;
      height: 200px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bag-emoji {
      font-size: 7rem;
      line-height: 1;
      transition: transform 0.3s;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
      user-select: none;
    }

    /* ── Reveal overlay ── */
    #reveal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #reveal-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }
    #reveal-card {
      background: linear-gradient(145deg, #1a3a6b, #0d2044);
      border: 3px solid #ffd700;
      border-radius: 24px;
      padding: 36px 44px;
      text-align: center;
      max-width: 340px;
      width: 90vw;
      position: relative;
      box-shadow: 0 0 60px rgba(255,215,0,0.35), 0 20px 50px rgba(0,0,0,0.7);
      transform: scale(0.5) rotate(-8deg);
      transition: transform 0.45s cubic-bezier(.2,1.4,.4,1);
    }
    #reveal-overlay.visible #reveal-card {
      transform: scale(1) rotate(0deg);
    }

    .reveal-emoji { font-size: 5.5rem; line-height: 1; margin-bottom: 8px; animation: bounce-in 0.6s 0.3s both; }
    .reveal-name { font-size: 1.6rem; font-weight: 900; color: #ffd700; margin-bottom: 4px; }
    .reveal-meta { font-size: 1rem; color: #aac4f0; margin-bottom: 10px; }
    .reveal-stars { font-size: 1.4rem; margin-bottom: 12px; }
    .reveal-flag { font-size: 2rem; }

    .duplicate-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff4444, #cc0000);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
      margin-top: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .new-badge {
      display: inline-block;
      background: linear-gradient(135deg, #00e676, #00aa44);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
      margin-top: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #dismiss-btn {
      margin-top: 18px;
      padding: 10px 32px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #0a1628;
      transition: transform 0.15s;
    }
    #dismiss-btn:hover { transform: scale(1.07); }

    /* ── Sparkle burst ── */
    .sparkle {
      position: absolute;
      pointer-events: none;
      font-size: 1.4rem;
      animation: sparkle-fly 0.9s ease-out forwards;
    }
    @keyframes sparkle-fly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
    }

    @keyframes bounce-in {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes bag-shake {
      0%,100% { transform: rotate(0deg); }
      20%     { transform: rotate(-12deg) scale(1.1); }
      40%     { transform: rotate(12deg) scale(1.15); }
      60%     { transform: rotate(-8deg) scale(1.1); }
      80%     { transform: rotate(8deg) scale(1.05); }
    }

    /* ── Collection grid ── */
    #collection-section h2 {
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffd700;
      margin-bottom: 18px;
      text-align: center;
    }

    #collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }

    .player-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
      border: 2px solid rgba(255,215,0,0.18);
      border-radius: 16px;
      padding: 14px 10px 12px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: default;
      position: relative;
      overflow: hidden;
    }
    .player-card.collected {
      border-color: rgba(255,215,0,0.55);
      background: linear-gradient(145deg, rgba(255,215,0,0.10), rgba(255,140,0,0.06));
      box-shadow: 0 0 16px rgba(255,215,0,0.12);
    }
    .player-card.collected:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: #ffd700;
      box-shadow: 0 8px 24px rgba(255,215,0,0.25);
    }
    .player-card.collected.duplicate {
      border-color: rgba(100,149,237,0.6);
    }

    .card-emoji {
      font-size: 2.8rem;
      line-height: 1;
      margin-bottom: 6px;
      display: block;
    }
    .card-emoji.mystery {
      filter: brightness(0) invert(0.15) sepia(0) saturate(0) contrast(0.4);
      font-size: 2.8rem;
    }

    .card-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: #ffd700;
      line-height: 1.2;
      margin-bottom: 3px;
    }
    .card-name.mystery-name {
      color: rgba(255,255,255,0.2);
    }

    .card-num {
      font-size: 0.8rem;
      font-weight: 900;
      color: #ffd700;
      margin-bottom: 2px;
    }
    .card-pos {
      font-size: 0.6rem;
      color: #aac4f0;
      font-weight: 600;
    }
    .draw-btn {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 8px;
      background: #ffd700;
      color: #0a1628;
      border-radius: 10px;
      font-size: 0.6rem;
      font-weight: 900;
      text-decoration: none;
    }
    .card-pos.mystery-pos { color: rgba(255,255,255,0.15); }

    .card-stars {
      font-size: 0.7rem;
      margin-top: 3px;
    }
    .card-flag {
      font-size: 1rem;
      margin-top: 2px;
      display: block;
    }

    .dup-tag {
      position: absolute;
      top: 5px; right: 5px;
      font-size: 0.55rem;
      background: #ff4444;
      color: #fff;
      padding: 1px 5px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ── Reset button ── */
    #reset-btn {
      display: block;
      margin: 32px auto 0;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      cursor: pointer;
      background: transparent;
      color: rgba(255,255,255,0.45);
      transition: all 0.2s;
    }
    #reset-btn:hover {
      background: rgba(255,50,50,0.15);
      border-color: rgba(255,80,80,0.5);
      color: #ff8080;
    }

    /* ── Confetti canvas ── */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
    }

    /* ── Mii Maker button ── */
    #mii-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-bottom: 36px;
    }

    #mii-btn {
      position: relative;
      padding: 18px 48px;
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff69b4 0%, #a855f7 100%);
      color: #fff;
      box-shadow: 0 0 30px rgba(168,85,247,0.5), 0 6px 20px rgba(0,0,0,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #mii-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(168,85,247,0.7), 0 8px 28px rgba(0,0,0,0.5); }
    #mii-btn:active { transform: scale(0.97); }

    /* ── Mii modal ── */
    #mii-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      overflow-y: auto;
      padding: 16px;
    }
    #mii-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }
    #mii-modal {
      background: linear-gradient(145deg, #1e1040, #2d1b69);
      border: 3px solid #a855f7;
      border-radius: 28px;
      padding: 28px 24px 24px;
      max-width: 540px;
      width: 100%;
      position: relative;
      box-shadow: 0 0 60px rgba(168,85,247,0.4), 0 20px 50px rgba(0,0,0,0.7);
      text-align: center;
    }
    #mii-modal h2 {
      font-size: 1.8rem;
      font-weight: 900;
      color: #f0abfc;
      margin-bottom: 6px;
      text-shadow: 0 0 20px rgba(240,171,252,0.5);
    }
    #mii-modal p.mii-sub {
      color: #c4b5fd;
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    #mii-canvas {
      border-radius: 20px;
      background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 100%);
      display: block;
      margin: 0 auto 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .mii-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
      text-align: left;
    }
    .mii-option-row {
      background: rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 8px 10px;
    }
    .mii-option-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #c4b5fd;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .mii-option-ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mii-arrow {
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 1rem;
      cursor: pointer;
      color: #fff;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .mii-arrow:hover { transform: scale(1.15); }
    .mii-arrow:active { transform: scale(0.9); }
    .mii-val {
      flex: 1;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
    }

    .mii-number-row {
      background: rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 8px 10px;
      grid-column: span 2;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mii-number-row label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #c4b5fd;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    #mii-jersey-num {
      flex: 1;
      padding: 6px 10px;
      border-radius: 10px;
      border: 2px solid #a855f7;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      outline: none;
    }
    #mii-jersey-num:focus { border-color: #f0abfc; }

    .mii-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 14px;
    }
    .mii-save-btn, .mii-dl-btn, .mii-close-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .mii-save-btn { background: linear-gradient(135deg, #00e676, #00aa44); color: #fff; }
    .mii-dl-btn   { background: linear-gradient(135deg, #40c4ff, #0070cc); color: #fff; }
    .mii-close-btn{ background: rgba(255,255,255,0.12); color: #c4b5fd; }
    .mii-save-btn:hover, .mii-dl-btn:hover, .mii-close-btn:hover { transform: scale(1.07); }

    /* ── My Mii display ── */
    #my-mii-section {
      margin-bottom: 36px;
      text-align: center;
    }
    #my-mii-section h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #f0abfc;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #my-mii-display {
      display: flex;
      justify-content: center;
    }
    #my-mii-display canvas {
      border-radius: 20px;
      background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 100%);
      box-shadow: 0 4px 24px rgba(168,85,247,0.35);
    }
  </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<header>
  <h1>⚽ FIFA Blind Bags</h1>
  <p>Open bags &amp; collect all 20 players!</p>
</header>

<div id="counter-bar">
  <span id="counter-text">0 / 20 collected</span>
  <div id="progress-bar-wrap">
    <div id="progress-bar"></div>
  </div>
</div>

<main>
  <section id="bag-section">
    <div id="bag-stage">
      <div class="bag-emoji" id="bag-icon">🛍️</div>
    </div>
    <button id="open-btn">🎁 Open Blind Bag!</button>
  </section>

  <!-- Mii Maker button -->
  <section id="mii-section">
    <button id="mii-btn">🧑 Make a Mii!</button>
  </section>

  <!-- My Mii display -->
  <div id="my-mii-section" style="display:none;">
    <h2>🧑 My Mii</h2>
    <div id="my-mii-display"></div>
  </div>

  <section id="collection-section">
    <h2>🏆 My Collection</h2>
    <div id="collection-grid"></div>
    <button id="reset-btn">Reset Collection</button>
  </section>
</main>

<!-- Mii Maker modal -->
<div id="mii-overlay">
  <div id="mii-modal">
    <h2>🎨 Mii Maker!</h2>
    <p class="mii-sub">Make your very own cartoon character!</p>

    <div class="mii-options">
      <!-- Skin color -->
      <div class="mii-option-row">
        <div class="mii-option-label">Skin Color</div>
        <div class="mii-option-ctrl">
          <button class="mii-arrow" data-trait="skin" data-dir="-1">◀</button>
          <span class="mii-val" id="mii-skin-val">Light</span>
          <button class="mii-arrow" data-trait="skin" data-dir="1">▶</button>
        </div>
      </div>
      <!-- Hair style -->
      <div class="mii-option-row">
        <div class="mii-option-label">Hair Style</div>
        <div class="mii-option-ctrl">
          <button class="mii-arrow" data-trait="hair" data-dir="-1">◀</button>
          <span class="mii-val" id="mii-hair-val">Short</span>
          <button class="mii-arrow" data-trait="hair" data-dir="1">▶</button>
        </div>
      </div>
      <!-- Hair color -->
      <div class="mii-option-row">
        <div class="mii-option-label">Hair Color</div>
        <div class="mii-option-ctrl">
          <button class="mii-arrow" data-trait="haircolor" data-dir="-1">◀</button>
          <span class="mii-val" id="mii-haircolor-val">Black</span>
          <button class="mii-arrow" data-trait="haircolor" data-dir="1">▶</button>
        </div>
      </div>
      <!-- Eye style -->
      <div class="mii-option-row">
        <div class="mii-option-label">Eyes</div>
        <div class="mii-option-ctrl">
          <button class="mii-arrow" data-trait="eyes" data-dir="-1">◀</button>
          <span class="mii-val" id="mii-eyes-val">Round</span>
          <button class="mii-arrow" data-trait="eyes" data-dir="1">▶</button>
        </div>
      </div>
      <!-- Mouth -->
      <div class="mii-option-row">
        <div class="mii-option-label">Mouth</div>
        <div class="mii-option-ctrl">
          <button class="mii-arrow" data-trait="mouth" data-dir="-1">◀</button>
          <span class="mii-val" id="mii-mouth-val">Smile</span>
          <button class="mii-arrow" data-trait="mouth" data-dir="1">▶</button>
        </div>
      </div>
      <!-- Jersey color -->
      <div class="mii-option-row">
        <div class="mii-option-label">Jersey Color</div>
        <div class="mii-option-ctrl">
          <button class="mii-arrow" data-trait="jersey" data-dir="-1">◀</button>
          <span class="mii-val" id="mii-jersey-val">Red</span>
          <button class="mii-arrow" data-trait="jersey" data-dir="1">▶</button>
        </div>
      </div>
      <!-- Jersey number -->
      <div class="mii-number-row">
        <label for="mii-jersey-num">Jersey Number:</label>
        <input id="mii-jersey-num" type="number" min="1" max="99" value="10" />
      </div>
    </div>

    <!-- Draw on face section -->
    <div id="draw-section">
      <div style="font-weight:900;color:#ffd700;margin-bottom:8px;">✏️ Draw on your Mii's face!</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;">
        <label style="color:#fff;font-size:0.85rem;">Color:
          <input type="color" id="draw-color" value="#ff0000" style="width:36px;height:28px;border:none;cursor:pointer;border-radius:6px;">
        </label>
        <label style="color:#fff;font-size:0.85rem;">Size:
          <input type="range" id="draw-size" min="2" max="20" value="5" style="width:70px;vertical-align:middle;">
        </label>
        <button id="draw-eraser" style="padding:4px 12px;border-radius:10px;border:none;background:#555;color:#fff;font-weight:700;cursor:pointer;">🧹 Eraser</button>
        <button id="draw-clear" style="padding:4px 12px;border-radius:10px;border:none;background:#cc2200;color:#fff;font-weight:700;cursor:pointer;">🗑️ Clear</button>
      </div>
      <div style="position:relative;display:inline-block;width:200px;height:250px;">
        <canvas id="mii-canvas" width="200" height="250" style="border-radius:12px;display:block;"></canvas>
        <canvas id="draw-canvas" width="200" height="250" style="position:absolute;top:0;left:0;cursor:crosshair;border-radius:12px;"></canvas>
      </div>

  ];

  const STORAGE_KEY = 'fifa_blind_bag_collection_v2';

  // collection: { [playerId]: count }
  function loadCollection() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }
  function saveCollection(col) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(col));
  }

  let collection = loadCollection();

  // ── DOM refs ─────────────────────────────────────────────────
  const openBtn       = document.getElementById('open-btn');
  const bagIcon       = document.getElementById('bag-icon');
  const overlay       = document.getElementById('reveal-overlay');
  const dismissBtn    = document.getElementById('dismiss-btn');
  const counterText   = document.getElementById('counter-text');
  const progressBar   = document.getElementById('progress-bar');
  const grid          = document.getElementById('collection-grid');
  const resetBtn      = document.getElementById('reset-btn');
  const canvas        = document.getElementById('confetti-canvas');
  const ctx           = canvas.getContext('2d');

  // ── Counter & grid ───────────────────────────────────────────
  function uniqueCount() {
    return Object.values(collection).filter(v => v > 0).length;
  }

  function updateCounter() {
    const n = uniqueCount();
    counterText.textContent = `${n} / ${PLAYERS.length} collected`;
    progressBar.style.width = `${(n / PLAYERS.length) * 100}%`;
  }

  function buildGrid() {
    grid.innerHTML = '';
    PLAYERS.forEach(p => {
      const count = collection[p.id] || 0;
      const hasIt = count > 0;
      const isDup = count > 1;
      const card  = document.createElement('div');
      card.className = 'player-card' + (hasIt ? ' collected' : '') + (isDup ? ' duplicate' : '');
      card.id = `card-${p.id}`;

      const stars = '⭐'.repeat(p.stars) + '☆'.repeat(5 - p.stars);

      if (hasIt) {
        card.innerHTML = `
          ${isDup ? `<span class="dup-tag">x${count}</span>` : ''}
          <span class="card-emoji">${p.flag}</span>
          <div class="card-num">#${p.num}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-pos">${p.pos} · ${p.country}</div>
          <div class="card-stars">${stars}</div>
          <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(p.name + ' soccer player full body')}" target="_blank" class="draw-btn">🎨 Draw</a>
        `;
      } else {
        card.innerHTML = `
          <span class="card-emoji mystery">⬛</span>
          <div class="card-num" style="color:rgba(255,255,255,0.15)">#??</div>
          <div class="card-name mystery-name">???</div>
          <div class="card-pos mystery-pos">???</div>
          <div class="card-stars" style="color:rgba(255,255,255,0.15)">${'☆'.repeat(5)}</div>
        `;
      }
      grid.appendChild(card);
    });
  }

  // ── Open bag ─────────────────────────────────────────────────
  openBtn.addEventListener('click', () => {
    openBtn.disabled = true;

    // Shake animation
    bagIcon.style.animation = 'none';
    void bagIcon.offsetWidth;
    bagIcon.style.animation = 'bag-shake 0.6s ease';

    setTimeout(() => {
      bagIcon.style.animation = '';
      // Pick random player
      const player = PLAYERS[Math.floor(Math.random() * PLAYERS.length)];
      const wasDup = (collection[player.id] || 0) > 0;

      collection[player.id] = (collection[player.id] || 0) + 1;
      saveCollection(collection);
      updateCounter();
      buildGrid();

      showReveal(player, wasDup);
      if (!wasDup) launchConfetti();
    }, 650);
  });

  // ── Reveal card ──────────────────────────────────────────────
  function starsStr(n) {
    return '⭐'.repeat(n) + '☆'.repeat(5 - n);
  }

  function showReveal(player, isDup) {
    document.getElementById('rv-emoji').textContent  = player.flag;
    document.getElementById('rv-name').textContent   = player.name;
    document.getElementById('rv-meta').textContent   = `#${player.num} · ${player.pos} · ${player.country}`;
    document.getElementById('rv-stars').textContent  = starsStr(player.stars);
    document.getElementById('rv-flag').textContent   = '';
    document.getElementById('rv-draw-link').href = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(player.name + ' soccer player full body')}`;


    const badge = document.getElementById('rv-badge');
    if (isDup) {
      badge.innerHTML = '<span class="duplicate-badge">Already got this one!</span>';
    } else {
      badge.innerHTML = '<span class="new-badge">🎉 New card!</span>';
    }

    overlay.classList.add('visible');
    spawnSparkles();
  }

  dismissBtn.addEventListener('click', () => {
    overlay.classList.remove('visible');
    openBtn.disabled = false;
  });
  overlay.addEventListener('click', e => {
    if (e.target === overlay) {
      overlay.classList.remove('visible');
      openBtn.disabled = false;
    }
  });

  // ── Sparkles ─────────────────────────────────────────────────
  function spawnSparkles() {
    const card = document.getElementById('reveal-card');
    const rect  = card.getBoundingClientRect();
    const emojis = ['✨','🌟','💫','⭐','🎉','🎊'];
    for (let i = 0; i < 14; i++) {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist  = 80 + Math.random() * 100;
      el.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
      el.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
      el.style.left = (rect.left + rect.width / 2 - 12) + 'px';
      el.style.top  = (rect.top  + rect.height / 2 - 12) + 'px';
      el.style.animationDelay = (Math.random() * 0.2) + 's';
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  // ── Confetti ─────────────────────────────────────────────────
  let confettiParticles = [];
  let confettiRunning   = false;

  function launchConfetti() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#ffd700','#ff8c00','#00e676','#40c4ff','#ff4081','#e040fb','#fff'];
    for (let i = 0; i < 90; i++) {
      confettiParticles.push({
        x: Math.random() * canvas.width,
        y: -10,
        r: 4 + Math.random() * 6,
        d: 1.5 + Math.random() * 2.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.random() * 10 - 5,
        tiltSpeed: 0.07 + Math.random() * 0.08,
        angle: 0,
        opacity: 1,
      });
    }
    if (!confettiRunning) {
      confettiRunning = true;
      animateConfetti();
    }
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiParticles.forEach(p => {
      p.angle     += p.tiltSpeed;
      p.y         += p.d;
      p.x         += Math.sin(p.angle) * 1.5;
      p.opacity   -= 0.007;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle   = p.color;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r, p.r * 0.5, p.tilt + p.angle, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    confettiParticles = confettiParticles.filter(p => p.opacity > 0 && p.y < canvas.height + 20);
    if (confettiParticles.length > 0) {
      requestAnimationFrame(animateConfetti);
    } else {
      confettiRunning = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  // ── Reset ─────────────────────────────────────────────────────
  resetBtn.addEventListener('click', () => {
    if (confirm('Reset your entire collection? This cannot be undone!')) {
      collection = {};
      saveCollection(collection);
      updateCounter();
      buildGrid();
    }
  });

  // ── Init ──────────────────────────────────────────────────────
  updateCounter();
  buildGrid();

  // ══════════════════════════════════════════════════════════════
  // MII MAKER
  // ══════════════════════════════════════════════════════════════
  const MII_STORAGE_KEY = 'mii_maker_v1';

  const MII_TRAITS = {
    skin: {
      options: [
        { label: 'Light',  color: '#ffe0bd' },
        { label: 'Medium', color: '#f1c27d' },
        { label: 'Tan',    color: '#c68642' },

  };

  let miiJerseyNum = 10;

  function getMiiState() {
    return {
      skin:      MII_TRAITS.skin.index,
      hair:      MII_TRAITS.hair.index,
      haircolor: MII_TRAITS.haircolor.index,
      eyes:      MII_TRAITS.eyes.index,
      mouth:     MII_TRAITS.mouth.index,
      jersey:    MII_TRAITS.jersey.index,
      facepaint: MII_TRAITS.facepaint.index,
      jerseyNum: miiJerseyNum,
    };
  }

  function setMiiState(state) {
    if (!state) return;
    MII_TRAITS.skin.index      = state.skin      || 0;
    MII_TRAITS.hair.index      = state.hair      || 0;
    MII_TRAITS.haircolor.index = state.haircolor || 0;
    MII_TRAITS.eyes.index      = state.eyes      || 0;
    MII_TRAITS.mouth.index     = state.mouth     || 0;
    MII_TRAITS.jersey.index    = state.jersey    || 0;
    MII_TRAITS.facepaint.index = state.facepaint || 0;
    miiJerseyNum               = state.jerseyNum || 10;
    document.getElementById('mii-jersey-num').value = miiJerseyNum;
    updateAllLabels();
  }

  function updateAllLabels() {
    for (const [trait, data] of Object.entries(MII_TRAITS)) {
      const el = document.getElementById(`mii-${trait}-val`);
      if (el) el.textContent = data.options[data.index].label;
    }
  }

  // ── Draw Mii on a canvas ─────────────────────────────────────
  function drawMii(targetCanvas, state) {
    const c = targetCanvas.getContext('2d');
    const W = targetCanvas.width;
    const H = targetCanvas.height;

    // resolve values
    const skinColor    = MII_TRAITS.skin.options[state.skin].color;
    const hairStyle    = MII_TRAITS.hair.options[state.hair].label;
    const hairColor    = MII_TRAITS.haircolor.options[state.haircolor].color;
    const eyeStyle     = MII_TRAITS.eyes.options[state.eyes].label;
    const mouthStyle   = MII_TRAITS.mouth.options[state.mouth].label;
    const jerseyColor  = MII_TRAITS.jersey.options[state.jersey].color;
    const facePaint    = MII_TRAITS.facepaint.options[state.facepaint || 0].label;
    const num          = state.jerseyNum;

    c.clearRect(0, 0, W, H);

    // Sky gradient background
    const bg = c.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#dbeafe');
    bg.addColorStop(1, '#ede9fe');
    c.fillStyle = bg;
    c.fillRect(0, 0, W, H);

    const cx = W / 2;
    // layout constants
    const headR   = 54;
    const headCY  = 95;
    const neckTop = headCY + headR - 8;
    const neckH   = 16;
    const bodyTop = neckTop + neckH;
    const bodyW   = 80;
    const bodyH   = 72;
    const legH    = 34;
    const legW    = 28;

    // ── Legs ──
    const legColors = ['#2a2a5a', '#1a1a4a'];
    // left leg
    c.fillStyle = legColors[0];
    c.beginPath();
    c.roundRect(cx - bodyW/2 + 4, bodyTop + bodyH - 4, legW, legH, [0, 0, 10, 10]);
    c.fill();
    // right leg
    c.fillStyle = legColors[1];
    c.beginPath();
    c.roundRect(cx + bodyW/2 - legW - 4, bodyTop + bodyH - 4, legW, legH, [0, 0, 10, 10]);
    c.fill();
    // shoes
    c.fillStyle = '#111';
    c.beginPath(); c.ellipse(cx - bodyW/2 + 4 + legW/2, bodyTop + bodyH + legH - 2, legW/2 + 4, 7, 0, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(cx + bodyW/2 - legW/2 - 4, bodyTop + bodyH + legH - 2, legW/2 + 4, 7, 0, 0, Math.PI*2); c.fill();

    // ── Jersey body ──
    const jerseyIsLight = jerseyColor === '#f0f0f0';
    c.fillStyle = jerseyColor;
    c.beginPath();
    c.roundRect(cx - bodyW/2, bodyTop, bodyW, bodyH, [6, 6, 0, 0]);
    c.fill();
    // jersey stripe
    c.fillStyle = jerseyIsLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.15)';
    c.fillRect(cx - 6, bodyTop, 12, bodyH);

    // jersey number
    c.fillStyle = jerseyIsLight ? '#222' : '#fff';
    c.font = `bold ${num > 9 ? 18 : 22}px Arial`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(String(num), cx, bodyTop + bodyH / 2 + 4);

    // ── Arms ──
    c.fillStyle = jerseyColor;
    // left arm
    c.beginPath(); c.roundRect(cx - bodyW/2 - 20, bodyTop + 6, 22, 44, 10); c.fill();
    // right arm
    c.beginPath(); c.roundRect(cx + bodyW/2 - 2, bodyTop + 6, 22, 44, 10); c.fill();
    // hands
    c.fillStyle = skinColor;
    c.beginPath(); c.ellipse(cx - bodyW/2 - 9, bodyTop + 52, 12, 10, 0, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(cx + bodyW/2 + 11, bodyTop + 52, 12, 10, 0, 0, Math.PI*2); c.fill();

    // ── Neck ──
    c.fillStyle = skinColor;
    c.fillRect(cx - 12, neckTop, 24, neckH + 4);

    // ── Head ──
    c.fillStyle = skinColor;
    c.beginPath();
    c.ellipse(cx, headCY, headR, headR + 4, 0, 0, Math.PI * 2);
    c.fill();
    // head outline
    c.strokeStyle = 'rgba(0,0,0,0.1)';
    c.lineWidth = 1.5;
    c.stroke();

    // ── Hair ──
    if (hairStyle !== 'Bald') {
      c.fillStyle = hairColor;
      if (hairStyle === 'Short') {
        c.beginPath();
        c.ellipse(cx, headCY - headR + 10, headR - 2, 32, 0, Math.PI, 0);
        c.fill();
        // hairline sides
        c.fillRect(cx - headR + 2, headCY - 30, 14, 28);
        c.fillRect(cx + headR - 16, headCY - 30, 14, 28);
      } else if (hairStyle === 'Long') {
        c.beginPath();
        c.ellipse(cx, headCY - headR + 10, headR - 2, 32, 0, Math.PI, 0);
        c.fill();
        // long sides
        c.beginPath();
        c.roundRect(cx - headR - 2, headCY - 20, 18, 90, [0, 0, 12, 12]);
        c.fill();
        c.beginPath();
        c.roundRect(cx + headR - 16, headCY - 20, 18, 90, [0, 0, 12, 12]);
        c.fill();
      } else if (hairStyle === 'Curly') {
        // curly blobs
        const blobs = [
          [cx - 30, headCY - headR - 4, 20],
          [cx,      headCY - headR - 10, 22],
          [cx + 30, headCY - headR - 4, 20],
          [cx - 45, headCY - 20, 16],
          [cx + 45, headCY - 20, 16],
        ];
        blobs.forEach(([bx, by, br]) => {
          c.beginPath(); c.arc(bx, by, br, 0, Math.PI * 2); c.fill();
        });
        // fill between blobs and head
        c.beginPath();
        c.ellipse(cx, headCY - headR + 14, headR - 4, 28, 0, Math.PI, 0);
        c.fill();
      } else if (hairStyle === 'Spiky') {
        // spiky triangles + base
        c.beginPath();
        c.ellipse(cx, headCY - headR + 14, headR - 2, 26, 0, Math.PI, 0);
        c.fill();
        const spikes = [-38, -20, 0, 20, 38];
        spikes.forEach(dx => {
          c.beginPath();
          c.moveTo(cx + dx - 12, headCY - headR + 14);
          c.lineTo(cx + dx, headCY - headR - 26);
          c.lineTo(cx + dx + 12, headCY - headR + 14);
          c.closePath();
          c.fill();
        });
      }
    }

    // ── Ears ──
    c.fillStyle = skinColor;
    c.beginPath(); c.ellipse(cx - headR + 2, headCY + 6, 10, 13, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(cx + headR - 2, headCY + 6, 10, 13, 0, 0, Math.PI * 2); c.fill();

    // ── Eyes ──
    const eyeLX = cx - 18;
    const eyeRX = cx + 18;
    const eyeY  = headCY + 2;

    function drawEye(ex, ey, style) {
      if (style === 'Round') {
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(ex, ey, 10, 0, Math.PI*2); c.fill();
        c.fillStyle = '#222';
        c.beginPath(); c.arc(ex, ey, 5, 0, Math.PI*2); c.fill();
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(ex + 2, ey - 2, 2, 0, Math.PI*2); c.fill();
      } else if (style === 'Oval') {
        c.fillStyle = '#fff';
        c.beginPath(); c.ellipse(ex, ey, 12, 8, 0, 0, Math.PI*2); c.fill();
        c.fillStyle = '#222';
        c.beginPath(); c.ellipse(ex, ey, 6, 5, 0, 0, Math.PI*2); c.fill();
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(ex + 2, ey - 2, 2, 0, Math.PI*2); c.fill();
      } else if (style === 'Star') {
        // draw a star shape
        c.fillStyle = '#333';
        c.save();
        c.translate(ex, ey);
        c.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? 10 : 5;
          const ang = (Math.PI / 5) * i - Math.PI / 2;
          i === 0 ? c.moveTo(Math.cos(ang)*r, Math.sin(ang)*r) : c.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
        }
        c.closePath(); c.fill();
        c.restore();
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(ex + 3, ey - 3, 2.5, 0, Math.PI*2); c.fill();
      } else if (style === 'Happy Squint') {
        c.strokeStyle = '#333';
        c.lineWidth = 3;
        c.lineCap = 'round';
        c.beginPath();
        c.arc(ex, ey + 4, 9, Math.PI + 0.2, -0.2, false);
        c.stroke();
        // little blush
        c.fillStyle = 'rgba(255,120,120,0.35)';
        c.beginPath(); c.ellipse(ex, ey + 10, 10, 5, 0, 0, Math.PI*2); c.fill();
      }
    }

    drawEye(eyeLX, eyeY, eyeStyle);
    drawEye(eyeRX, eyeY, eyeStyle);

    // ── Eyebrows ──
    c.strokeStyle = hairStyle === 'Bald' ? '#555' : hairColor;
    c.lineWidth = 3;
    c.lineCap = 'round';
    c.beginPath(); c.moveTo(eyeLX - 9, eyeY - 14); c.lineTo(eyeLX + 9, eyeY - 12); c.stroke();
    c.beginPath(); c.moveTo(eyeRX + 9, eyeY - 14); c.lineTo(eyeRX - 9, eyeY - 12); c.stroke();

    // ── Nose ──
    c.strokeStyle = 'rgba(0,0,0,0.18)';
    c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(cx - 5, headCY + 14);
    c.quadraticCurveTo(cx - 8, headCY + 22, cx, headCY + 24);
    c.quadraticCurveTo(cx + 8, headCY + 22, cx + 5, headCY + 14);
    c.stroke();

    // ── Mouth ──
    const mouthY = headCY + 36;
    c.strokeStyle = '#cc4455';
    c.lineWidth = 3;
    c.lineCap = 'round';
    if (mouthStyle === 'Smile') {
      c.beginPath();
      c.arc(cx, mouthY - 4, 14, 0.2, Math.PI - 0.2);
      c.stroke();
    } else if (mouthStyle === 'Big Smile') {
      c.fillStyle = '#cc2233';
      c.beginPath();
      c.arc(cx, mouthY - 6, 18, 0, Math.PI);
      c.fill();
      c.fillStyle = '#fff';
      c.fillRect(cx - 16, mouthY - 6, 32, 8);
      c.fillStyle = '#fff';
      c.beginPath();
      c.roundRect(cx - 14, mouthY - 9, 8, 8, 2);
      c.fill();
      c.beginPath();
      c.roundRect(cx - 4, mouthY - 9, 8, 8, 2);
      c.fill();
      c.beginPath();
      c.roundRect(cx + 6, mouthY - 9, 8, 8, 2);
      c.fill();
    } else if (mouthStyle === 'Surprised O') {
      c.fillStyle = '#cc2233';
      c.beginPath();
      c.ellipse(cx, mouthY, 10, 14, 0, 0, Math.PI*2);
      c.fill();
      c.strokeStyle = '#111';
      c.lineWidth = 1.5;
      c.stroke();
    } else if (mouthStyle === 'Cool Line') {
      c.beginPath();
      c.moveTo(cx - 14, mouthY);
      c.lineTo(cx + 14, mouthY);
      c.stroke();
      // sunglasses
      c.fillStyle = 'rgba(0,0,0,0.75)';
      c.beginPath(); c.ellipse(eyeLX, eyeY, 13, 9, -0.15, 0, Math.PI*2); c.fill();
      c.beginPath(); c.ellipse(eyeRX, eyeY, 13, 9, 0.15, 0, Math.PI*2); c.fill();
      c.strokeStyle = '#111';
      c.lineWidth = 2;
      c.beginPath(); c.moveTo(eyeLX + 13, eyeY); c.lineTo(eyeRX - 13, eyeY); c.stroke();
      // arms
      c.beginPath(); c.moveTo(eyeLX - 13, eyeY); c.lineTo(cx - headR + 10, eyeY + 2); c.stroke();
      c.beginPath(); c.moveTo(eyeRX + 13, eyeY); c.lineTo(cx + headR - 10, eyeY + 2); c.stroke();
    }

    // ── Face paint ──
    if (facePaint === 'War Stripes') {
      c.fillStyle = '#e02020';
      c.fillRect(cx - headR*0.6, eyeY - 4, headR*0.45, 8);
      c.fillRect(cx + headR*0.15, eyeY - 4, headR*0.45, 8);
    } else if (facePaint === 'Star') {
      c.fillStyle = '#ffd700';
      c.font = `bold ${headR*0.6}px Arial`;
      c.textAlign = 'center';
      c.fillText('★', cx, mouthY - headR*0.25);
    } else if (facePaint === 'Lightning') {
      c.strokeStyle = '#ffdd00';
      c.lineWidth = 3;
      c.beginPath();
      c.moveTo(cx - 4, eyeY - 14);
      c.lineTo(cx + 4, eyeY + 2);
      c.lineTo(cx - 2, eyeY + 2);
      c.lineTo(cx + 6, eyeY + 16);
      c.stroke();
    } else if (facePaint === 'Heart') {
      c.fillStyle = '#ff69b4';
      c.font = `bold ${headR*0.5}px Arial`;
      c.textAlign = 'center';
      c.fillText('♥', cx, mouthY - headR*0.2);
    } else if (facePaint === 'Zigzag') {
      c.strokeStyle = '#00ccff';
      c.lineWidth = 3;
      c.beginPath();
      const zx = cx - headR*0.5, zy = eyeY + 10, zw = headR;
      for (let i = 0; i <= 4; i++) {
        c.lineTo(zx + (zw/4)*i, zy + (i%2===0 ? 0 : 10));
      }
      c.stroke();
    }

    // ── Jersey collar ──
    c.fillStyle = jerseyIsLight ? '#ddd' : 'rgba(255,255,255,0.25)';
    c.beginPath();
    c.ellipse(cx, bodyTop + 8, 16, 10, 0, 0, Math.PI*2);
    c.fill();
  }

  // ── Mii overlay control ──────────────────────────────────────
  const miiOverlay   = document.getElementById('mii-overlay');
  const miiCanvas    = document.getElementById('mii-canvas');
  const miiOpenBtn   = document.getElementById('mii-btn');
  const miiCloseBtn  = document.getElementById('mii-close-btn');
  const miiSaveBtn   = document.getElementById('mii-save-btn');
  const miiDlBtn     = document.getElementById('mii-dl-btn');
  const miiNumInput  = document.getElementById('mii-jersey-num');

  function redrawMii() {
    drawMii(miiCanvas, getMiiState());
  }

  miiOpenBtn.addEventListener('click', () => {
    miiOverlay.classList.add('visible');
    updateAllLabels();
    redrawMii();
  });

  miiCloseBtn.addEventListener('click', () => miiOverlay.classList.remove('visible'));
  miiOverlay.addEventListener('click', e => { if (e.target === miiOverlay) miiOverlay.classList.remove('visible'); });

  // Arrow buttons
  document.querySelectorAll('.mii-arrow').forEach(btn => {
    btn.addEventListener('click', () => {
      const trait = btn.dataset.trait;
      const dir   = parseInt(btn.dataset.dir, 10);
      const data  = MII_TRAITS[trait];
      data.index  = (data.index + dir + data.options.length) % data.options.length;
      document.getElementById(`mii-${trait}-val`).textContent = data.options[data.index].label;
      redrawMii();
    });
  });

  miiNumInput.addEventListener('input', () => {
    let v = parseInt(miiNumInput.value, 10);
    if (isNaN(v) || v < 1) v = 1;
    if (v > 99) v = 99;
    miiJerseyNum = v;
    redrawMii();
  });

  // Save
  miiSaveBtn.addEventListener('click', () => {
    const state = getMiiState();
    localStorage.setItem(MII_STORAGE_KEY, JSON.stringify(state));

    // Show in "My Mii" section
    const myMiiSection = document.getElementById('my-mii-section');
    const myMiiDisplay = document.getElementById('my-mii-display');
    myMiiDisplay.innerHTML = '';
    const savedCanvas = document.createElement('canvas');
    savedCanvas.width  = 200;
    savedCanvas.height = 250;
    drawMii(savedCanvas, state);
    myMiiDisplay.appendChild(savedCanvas);
    myMiiSection.style.display = 'block';
    miiOverlay.classList.remove('visible');
  });

  // Download
  miiDlBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'my-mii.png';
    link.href = miiCanvas.toDataURL('image/png');
    link.click();
  });

  // Load saved mii on startup
  (function loadSavedMii() {
    try {
      const saved = JSON.parse(localStorage.getItem(MII_STORAGE_KEY));
      if (!saved) return;
      setMiiState(saved);
      const myMiiSection = document.getElementById('my-mii-section');
      const myMiiDisplay = document.getElementById('my-mii-display');
      myMiiDisplay.innerHTML = '';
      const savedCanvas = document.createElement('canvas');
      savedCanvas.width  = 200;
      savedCanvas.height = 250;
      drawMii(savedCanvas, saved);
      myMiiDisplay.appendChild(savedCanvas);
      myMiiSection.style.display = 'block';
    } catch (e) { /* ignore */ }
  })();

  // ── Free Draw on Mii ─────────────────────────────────────────
  const drawCanvas = document.getElementById('draw-canvas');
  const drawCtx    = drawCanvas.getContext('2d');
  let isDrawing    = false;
  let eraserMode   = false;

  function getPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const scaleX = drawCanvas.width  / rect.width;
    const scaleY = drawCanvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function startDraw(e) {
    e.preventDefault();
    isDrawing = true;
    const {x, y} = getPos(e);
    drawCtx.beginPath();
    drawCtx.moveTo(x, y);
  }

  function doDraw(e) {
    e.preventDefault();
    if (!isDrawing) return;
    const {x, y} = getPos(e);
    const size = parseInt(document.getElementById('draw-size').value);
    drawCtx.lineWidth   = size;
    drawCtx.lineCap     = 'round';
    drawCtx.lineJoin    = 'round';
    if (eraserMode) {
      drawCtx.globalCompositeOperation = 'destination-out';
      drawCtx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.strokeStyle = document.getElementById('draw-color').value;
    }
    drawCtx.lineTo(x, y);
    drawCtx.stroke();
    drawCtx.beginPath();
    drawCtx.moveTo(x, y);
  }

  function stopDraw() { isDrawing = false; drawCtx.beginPath(); }

  drawCanvas.addEventListener('mousedown',  startDraw);
  drawCanvas.addEventListener('mousemove',  doDraw);
  drawCanvas.addEventListener('mouseup',    stopDraw);
  drawCanvas.addEventListener('mouseleave', stopDraw);
  drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
  drawCanvas.addEventListener('touchmove',  doDraw,    { passive: false });
  drawCanvas.addEventListener('touchend',   stopDraw);

  document.getElementById('draw-eraser').addEventListener('click', () => {
    eraserMode = !eraserMode;
    document.getElementById('draw-eraser').textContent = eraserMode ? '✏️ Draw' : '🧹 Eraser';
    document.getElementById('draw-eraser').style.background = eraserMode ? '#ffd700' : '#555';
    document.getElementById('draw-eraser').style.color = eraserMode ? '#000' : '#fff';
  });

  document.getElementById('draw-clear').addEventListener('click', () => {
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  });
</script>
</body>
</html>
