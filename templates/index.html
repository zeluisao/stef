<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FridgeCook</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🍽️ FridgeCook</h1>
    <p>Upload up to 5 fridge photos and get a recipe for any meal</p>
  </header>

  <main>
    <section class="upload-section">

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
        <div class="drop-content" id="dropContent">
          <div class="camera-icon">📷</div>
          <p>Click or drag fridge photos here</p>
          <span>Up to 5 photos · JPG, PNG, WEBP</span>
        </div>
      </div>

      <div class="thumbnails" id="thumbnails"></div>

      <div class="meal-selector">
        <p>What are you making?</p>
        <div class="meal-buttons">
          <button class="meal-btn active" data-meal="breakfast">🍳 Breakfast</button>
          <button class="meal-btn" data-meal="lunch">🥗 Lunch</button>
          <button class="meal-btn" data-meal="dessert">🍰 Dessert</button>
        </div>
      </div>

      <button id="scanBtn" class="scan-btn" disabled>Get Recipe</button>
    </section>

    <section class="results hidden" id="results">
      <div class="ingredients-box">
        <h2>Ingredients Found</h2>
        <ul id="ingredientsList"></ul>
      </div>

      <div class="recipe-card" id="recipeCard">
        <div class="meal-label" id="mealLabel"></div>
        <h3 id="recipeName"></h3>
        <h4>What you'll need:</h4>
        <ul id="recipeIngredients"></ul>
        <h4>How to make it:</h4>
        <ol id="recipeSteps"></ol>
      </div>
    </section>

    <div class="loader hidden" id="loader">
      <div class="spinner"></div>
      <p id="loaderText">Scanning your fridge...</p>
    </div>

    <div class="error hidden" id="errorBox"></div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
