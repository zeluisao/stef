<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>⚽ Captain Tsubasa Soccer in the Galaxy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#1a6b2f 0%,#0d4a8a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.game-container{width:100%;max-width:700px}
header{text-align:center;color:white;margin-bottom:24px}
header h1{font-size:2.2rem;text-shadow:2px 2px 6px rgba(0,0,0,.5);letter-spacing:1px}
.subtitle{font-size:1rem;color:#c8e6c9;margin-top:6px}
.story-card{background:white;border-radius:20px;padding:36px 40px;box-shadow:0 12px 40px rgba(0,0,0,.35);border-top:8px solid #1565c0;animation:fadeIn .4s ease}
.card-win{border-top-color:#f9a825}
.card-lose{border-top-color:#c62828}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.emoji-display{font-size:4rem;text-align:center;margin-bottom:20px}
.story-text{font-size:1.15rem;line-height:1.8;color:#333;margin-bottom:32px}
.choices{display:flex;flex-direction:column;gap:12px}
.btn{display:block;width:100%;padding:14px 20px;font-size:1rem;font-weight:600;border:none;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:center;text-decoration:none;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.btn:active{transform:translateY(0)}
.btn-choice{background:linear-gradient(135deg,#1565c0,#1e88e5);color:white}
.btn-choice:hover{background:linear-gradient(135deg,#0d47a1,#1565c0)}
.ending{text-align:center}
.win-title{font-size:2rem;color:#f9a825;margin-bottom:10px}
.lose-title{font-size:2rem;color:#c62828;margin-bottom:10px}
.ending p{color:#555;margin-bottom:24px;font-size:1.1rem}
.btn-restart{background:linear-gradient(135deg,#2e7d32,#43a047);color:white;font-size:1.1rem;max-width:240px;margin:0 auto;display:block}
footer{text-align:center;color:#a5d6a7;font-size:.85rem;margin-top:20px}
footer code{background:rgba(255,255,255,.15);padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="game-container">
  <header>
    <h1>⚽ Captain Tsubasa Soccer in the Galaxy</h1>
    <p class="subtitle">Your Soccer Story Adventure</p>
  </header>
  <main id="game"></main>
  <footer><p>Just open this file in any browser — no internet needed! Edit the <code>STORY</code> object below to add your own chapters.</p></footer>
</div>

<script>
// ─── STORY DATA ───────────────────────────────────────────────────────────────
// To add your own node, copy any block below and give it a new unique name.
// Make sure the "next" values in choices match another node name exactly!
const STORY = {
  start:{
    text:"You are Tsubasa Ozora, an 11-year-old soccer player from Nankatsu City. Today is the day of the big match against Shutetsu FC! Your team is counting on you. What do you do before the match?",
    emoji:"⚽",
    choices:[
      {text:"Practice your Drive Shot on the field",next:"practice"},
      {text:"Talk to your teammate Oliver to plan tactics",next:"tactics"},
      {text:"Watch the rival team warm up to learn their style",next:"scout"},
      {text:"Visit Genzo in goal to build team spirit",next:"genzo_talk"},
      {text:"⭐ DREAM TEAM — Join the Japan Youth World Cup squad!",next:"dream_start"},
    ]
  },
  practice:{
    text:"You spend an hour perfecting your famous Drive Shot. The ball screams through the air like a rocket! Coach Roberto watches and nods. 'Your shot is strong, Tsubasa.' The match begins — it's 0-0. You get a free kick 30 meters out!",
    emoji:"🦵",
    choices:[
      {text:"Unleash the Drive Shot!",next:"drive_shot_win"},
      {text:"Pass to Oliver for a Twin Shot",next:"twin_shot"},
      {text:"Look up — Santana is rushing at you!",next:"santana_block"},
    ]
  },
  drive_shot_win:{text:"You plant your foot, swing your leg with everything you have — BOOM! The ball tears through the air and smashes into the top corner! GOOOAL! The crowd goes wild! Nankatsu leads 1-0! The final whistle blows. YOU WIN!",emoji:"🏆",ending:"win"},
  twin_shot:{text:"You and Oliver line up side by side. 'Together!' you shout. Both of you kick at the same instant — the goalkeeper doesn't know which way to dive! DOUBLE GOAL! The net explodes! Nankatsu wins 2-0!",emoji:"🌟",ending:"win"},
  santana_block:{
    text:"The fearsome Santana from South America charges towards you! He's the best player on Shutetsu. You have a split second to decide.",
    emoji:"😰",
    choices:[
      {text:"Hold your ground and shoot through him",next:"santana_shoot"},
      {text:"Dribble left and go around him",next:"santana_dribble"},
      {text:"Dummy the shot and let Oliver in",next:"oliver_shoots"},
    ]
  },
  santana_shoot:{text:"You shoot with all your power straight through Santana's challenge! The ball deflects off his shin... and loops into the net! An incredible lucky goal — but a goal is a goal! Nankatsu wins 1-0!",emoji:"🍀",ending:"win"},
  santana_dribble:{text:"You feint left — Santana goes the wrong way! You burst into the box, one-on-one with the keeper. Coolly you slide the ball into the bottom corner. GOOOAL! The crowd roars! Nankatsu wins!",emoji:"💨",ending:"win"},
  tactics:{
    text:"Oliver sketches a plan on the ground with a stick. 'If we press high, their goalkeeper gets nervous.' You both agree on a signal: thumbs up means run into space. In the match, you spot Oliver give the thumbs up at the perfect moment!",
    emoji:"🤝",
    choices:[
      {text:"Sprint into space and receive Oliver's pass",next:"through_ball"},
      {text:"Fake the run and let Oliver shoot alone",next:"oliver_shoots"},
      {text:"Signal back: ask Oliver to make the run instead",next:"switch_roles"},
    ]
  },
  through_ball:{text:"You burst past two defenders at full speed. Oliver's pass is perfectly timed — it lands right at your feet! One-on-one with the goalkeeper... you chip the ball over him! GOOOAL! Nankatsu wins the match!",emoji:"🏅",ending:"win"},
  oliver_shoots:{text:"You fake the run brilliantly — three defenders follow you! Oliver has a wide-open shot. He blasts it into the net! 'Great assist, Tsubasa!' Oliver shouts. Nankatsu wins thanks to your selfless play!",emoji:"🥇",ending:"win"},
  switch_roles:{text:"Oliver nods and makes the run instead of you. He receives the ball in space, but a defender catches up. Oliver squares it back to you in the middle — completely free! You smash a volley into the roof of the net. GOOOAL!",emoji:"🔄",ending:"win"},
  scout:{
    text:"You notice Shutetsu's goalkeeper always dives left on shots. That's a secret weapon! You whisper this to Benji Price before the match. Benji grins: 'Good eyes, Tsubasa!' Late in the game, it's 1-1. You win a penalty kick!",
    emoji:"🔍",
    choices:[
      {text:"Shoot right — the keeper's weak side!",next:"penalty_win"},
      {text:"Blast it straight down the middle",next:"penalty_miss"},
      {text:"Let Benji take the penalty instead",next:"benji_penalty"},
    ]
  },
  penalty_win:{text:"You step up calmly. You remember what you saw during warm-ups. You shoot right — the keeper dives left! The ball rolls gently into the empty net. Nankatsu wins the championship 2-1! Heroes!",emoji:"🎉",ending:"win"},
  penalty_miss:{text:"You blast it straight and hard — but the keeper guessed right! He catches the ball easily. 1-1 at full time. The match goes to extra time. Your legs are tired. Shutetsu scores in extra time. You lose 2-1. But Roberto smiles: 'A loss teaches more than a win. Train harder!'",emoji:"😤",ending:"lose"},
  benji_penalty:{text:"You hand the ball to Benji. He looks surprised but determined. 'I trust you,' you say. Benji places the ball on the spot. He runs up slowly... and curls it into the top corner! Benji leaps into the air! Nankatsu wins 2-1! A true team victory!",emoji:"🤜🤛",ending:"win"},
  genzo_talk:{
    text:"You find Genzo Wakabayashi stretching in goal. He is Shutetsu's legendary goalkeeper — and today he's your rival! Wait... Genzo looks sad. 'I hurt my hand in training,' he admits quietly. What do you do with this information?",
    emoji:"🧤",
    choices:[
      {text:"Keep it secret and use it to your advantage",next:"genzo_exploit"},
      {text:"Tell your team to play fair — no targeting the injury",next:"genzo_fair"},
      {text:"Encourage Genzo: 'A great keeper plays with heart, not hands'",next:"genzo_inspire"},
    ]
  },
  genzo_exploit:{text:"You tell your team to shoot at Genzo's hurt hand every time. You score two easy goals... but the crowd boos. Even your own teammates look uncomfortable. Nankatsu wins 2-0, but no one celebrates. Coach Roberto says quietly: 'We won the match but lost our honour.'",emoji:"😔",ending:"lose"},
  genzo_fair:{text:"You tell your team to play normally — no targeting the injury. Genzo plays brilliantly despite the pain, saving shot after shot. In the last minute you score a wonder goal from 40 metres. Genzo applauds from his goal. 'Well played, Tsubasa.' Nankatsu wins 1-0. A victory to be proud of!",emoji:"🤺",ending:"win"},
  genzo_inspire:{text:"Genzo stares at you, then smiles. 'You're right.' Inspired by your words, Genzo plays the match of his life — but so do you! The game ends 1-1 after a thrilling battle. In the penalty shootout you score the winning kick. Genzo walks over and shakes your hand: 'Rivals and friends.'",emoji:"🌅",ending:"win"},
  dream_start:{
    text:"A letter arrives from the Japan Football Federation. 'Tsubasa Ozora — you are selected for the Japan Youth World Cup Squad!' You will face the best teams on the planet. Coach Kira calls the squad together for the first time. Who do you talk to first?",
    emoji:"🇯🇵",
    choices:[
      {text:"Greet Hyuga Kojiro — your old rival, now your teammate",next:"dream_hyuga"},
      {text:"Find Misaki Taro — your best friend and creative midfielder",next:"dream_misaki"},
      {text:"Watch Schneider train alone — the German star is unstoppable",next:"dream_schneider_watch"},
    ]
  },
  dream_hyuga:{
    text:"Hyuga crosses his arms and looks away. 'Don't think I'm your friend just because we're on the same team, Ozora.' You smile — you know this is just how he talks. 'Then let's prove we're the best pair in the world,' you reply. Hyuga almost smiles. Your first group match is against France!",
    emoji:"🐯",
    choices:[
      {text:"Combine with Hyuga for the Skylab Hurricane twin shot",next:"dream_skylab"},
      {text:"Play your own game and trust Hyuga to do the same",next:"dream_individual"},
    ]
  },
  dream_misaki:{
    text:"Misaki grins and passes you the ball perfectly — even indoors! 'I've been studying France's defence,' he says, showing you notes. Their left back is slow on the turn. You and Misaki plan a move: you make a deep run, he plays it first-time. In the match, the moment arrives — Misaki gives you the signal!",
    emoji:"🎯",
    choices:[
      {text:"Make the run — trust the plan!",next:"dream_misaki_goal"},
      {text:"Change the plan last second — shoot from outside the box",next:"dream_long_shot"},
    ]
  },
  dream_schneider_watch:{
    text:"Karl Heinz Schneider of West Germany is practising alone. His speed is terrifying — he runs 100m in under 11 seconds with a ball! Schneider notices you watching. 'Japan is not ready for me,' he says coldly. Your blood boils. Japan's first group match is tomorrow. How do you prepare?",
    emoji:"⚡",
    choices:[
      {text:"Train extra sprints all night to match his pace",next:"dream_tired"},
      {text:"Study video of him — find a weakness in his movement",next:"dream_video"},
      {text:"Focus on your own strengths, not his",next:"dream_self_belief"},
    ]
  },
  dream_skylab:{
    text:"Hyuga and you rehearse the Skylab Hurricane in training — both of you leap, scissor-kick, and connect at the same time. In the match against France, you win a corner. The ball swings in... you and Hyuga both jump...",
    emoji:"🌪️",
    choices:[
      {text:"Execute the Skylab Hurricane perfectly!",next:"dream_skylab_goal"},
      {text:"Pull out — the timing feels wrong",next:"dream_skylab_miss"},
    ]
  },
  dream_individual:{text:"You and Hyuga both play brilliantly on your own sides of the attack. France struggle to mark two unstoppable forwards at once! Hyuga scores with the Tiger Shot. You score with the Drive Shot. Japan wins 2-0. After the match Hyuga says quietly: 'Not bad, Ozora.'",emoji:"🤜",ending:"win"},
  dream_skylab_goal:{text:"PERFECTION! You and Hyuga connect like a thunderbolt — the ball rockets into the top corner so fast the goalkeeper doesn't move! The stadium falls silent... then erupts! Japan wins 1-0. The commentators call it the greatest goal ever scored.",emoji:"🌠",ending:"win"},
  dream_skylab_miss:{text:"You pull out — but Hyuga didn't! He connects alone and the ball flies wide. Hyuga glares at you. The match ends 0-0. In the dressing room, Hyuga says: 'If you're not sure, say so before the game.' It's a tough lesson — communication matters as much as skill.",emoji:"😓",ending:"lose"},
  dream_misaki_goal:{text:"You sprint behind the French defence at full speed. Misaki's pass is inch-perfect — it drops right into your stride! You hammer it first time into the net. GOOOAL! The plan worked exactly as designed. Japan wins 1-0. Misaki runs to you: 'Perfect execution, Tsubasa!'",emoji:"🎉",ending:"win"},
  dream_long_shot:{text:"You ignore the plan and shoot from 35 metres — right at the goalkeeper. He saves it easily. Misaki says nothing, but you see the disappointment. France counter-attack and score. Japan loses 1-0. Coach Kira is calm: 'Trust your teammates. A team is stronger than one.'",emoji:"😞",ending:"lose"},
  dream_tired:{text:"You train all night. By morning your legs feel like lead. In the match, Schneider runs straight past you twice. Japan loses 2-0. In the dressing room you realise: rest is part of training. A tired body cannot do what a rested one can.",emoji:"😴",ending:"lose"},
  dream_video:{text:"You spot it: Schneider always cuts inside on his left foot. You tell Genzo to position wide right. In the match, Schneider cuts inside — Genzo reads it perfectly and saves! On the counter-attack you score the Drive Shot. Japan wins 1-0! Schneider stares at you: 'How did you know?' You smile.",emoji:"🎬",ending:"win"},
  dream_self_belief:{text:"You sleep well and eat a good breakfast. In the match you play your natural game — fast, joyful, fearless. Schneider tries to intimidate you, but you laugh it off. In the 80th minute you dribble past him and score. Japan wins 1-0. Afterwards Schneider says: 'You play with your heart.'",emoji:"💛",ending:"win"},
};
// ─── END OF STORY DATA ────────────────────────────────────────────────────────

function render(nodeId) {
  const node = STORY[nodeId];
  if (!node) { render("start"); return; }
  const game = document.getElementById("game");
  const isWin  = node.ending === "win";
  const isLose = node.ending === "lose";
  game.innerHTML = `
    <div class="story-card${isWin?" card-win":isLose?" card-lose":""}">
      <div class="emoji-display">${node.emoji}</div>
      <p class="story-text">${node.text}</p>
      ${node.ending ? `
        <div class="ending">
          ${isWin
            ? `<h2 class="win-title">🏆 VICTORY! 🏆</h2><p>You led your team to glory!</p>`
            : `<h2 class="lose-title">😤 Keep Training!</h2><p>Every champion loses sometimes. Try again!</p>`}
          <button class="btn btn-restart" onclick="render('start')">▶ Play Again</button>
        </div>` : `
        <div class="choices">
          ${node.choices.map(c =>
            `<button class="btn btn-choice" onclick="render('${c.next}')">${c.text}</button>`
          ).join("")}
        </div>`}
    </div>`;
}

render("start");
</script>
</body>
</html>
