<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>⚽ Captain Tsubasa Soccer in the Galaxy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#0a0015;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(138,43,226,.25) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(0,100,255,.2) 0%,transparent 50%),radial-gradient(ellipse at 60% 80%,rgba(255,0,150,.15) 0%,transparent 50%);pointer-events:none;z-index:0}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.game-container{width:100%;max-width:740px;position:relative;z-index:1}
header{text-align:center;color:white;margin-bottom:24px}
header h1{font-size:2rem;text-shadow:0 0 20px rgba(180,100,255,.8),0 0 40px rgba(100,150,255,.5),2px 2px 6px rgba(0,0,0,.8);background:linear-gradient(90deg,#a78bfa,#60a5fa,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;background-size:200%}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
.subtitle{font-size:1rem;color:#c4b5fd;margin-top:6px}
.card{background:white;border-radius:20px;padding:32px 36px;box-shadow:0 12px 40px rgba(0,0,0,.35);border-top:8px solid #1565c0;animation:fadeIn .35s ease}
.card-win{border-top-color:#f9a825}
.card-lose{border-top-color:#c62828}
.card-dream{border-top-color:#7b1fa2}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.emoji-big{font-size:3.5rem;text-align:center;margin-bottom:16px}
.story-text{font-size:1.1rem;line-height:1.8;color:#333;margin-bottom:28px}
.choices{display:flex;flex-direction:column;gap:10px}
.btn{display:block;width:100%;padding:13px 18px;font-size:1rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:center;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.btn-blue{background:linear-gradient(135deg,#1565c0,#1e88e5);color:white}
.btn-green{background:linear-gradient(135deg,#2e7d32,#43a047);color:white;max-width:260px;margin:0 auto;display:block}
.btn-purple{background:linear-gradient(135deg,#6a1b9a,#8e24aa);color:white}
.btn-gold{background:linear-gradient(135deg,#f57f17,#fbc02d);color:#1a1a1a}
.ending{text-align:center}
.win-title{font-size:1.9rem;color:#f9a825;margin-bottom:8px}
.lose-title{font-size:1.9rem;color:#c62828;margin-bottom:8px}
.ending p{color:#555;margin-bottom:20px;font-size:1.05rem}
footer{text-align:center;color:#a5d6a7;font-size:.8rem;margin-top:18px}

/* ── Soccer Field ── */
.field{background:linear-gradient(180deg,#2d8a2d 0%,#256e25 50%,#2d8a2d 100%);border-radius:16px;padding:16px 12px;position:relative;border:4px solid white;margin-bottom:18px;overflow:hidden}
.field::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35);transform:translateX(-50%)}
.field::after{content:'';position:absolute;left:50%;top:50%;width:80px;height:80px;border:2px solid rgba(255,255,255,.35);border-radius:50%;transform:translate(-50%,-50%)}
.field-row{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:8px 0;position:relative;z-index:1}
.field-label{color:rgba(255,255,255,.5);font-size:.65rem;font-weight:700;letter-spacing:1px;text-align:center;text-transform:uppercase;margin-top:4px}
.pcard{background:rgba(255,255,255,.93);border-radius:10px;padding:7px 8px;text-align:center;min-width:64px;cursor:default;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .15s}
.pcard:hover{transform:translateY(-3px)}
.pcard .pe{font-size:1.8rem;line-height:1}
.pcard .pn{font-size:.68rem;font-weight:700;color:#1a1a1a;margin-top:2px;white-space:nowrap}
.field-divider{height:2px;background:rgba(255,255,255,.3);margin:6px 16px;border-radius:2px}

/* ── Match Engine ── */
.match-header{background:linear-gradient(90deg,#1a237e,#283593,#1a237e);border-radius:14px 14px 0 0;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;color:white;font-weight:700;font-size:.85rem}
.match-score{font-size:1.8rem;font-weight:900;letter-spacing:4px;text-shadow:0 0 10px rgba(255,220,0,.8);color:#ffd700}
.match-timer{background:rgba(0,0,0,.4);padding:4px 10px;border-radius:8px;font-size:.9rem}
.match-body{background:linear-gradient(180deg,#1b5e20,#2e7d32,#1b5e20);padding:10px;display:grid;grid-template-columns:110px 1fr 110px;gap:8px;align-items:center;min-height:160px}
.hud-card{background:linear-gradient(160deg,#0d47a1,#1565c0);border-radius:12px;padding:8px;color:white;text-align:center;border:2px solid rgba(255,255,255,.3)}
.hud-card.enemy{background:linear-gradient(160deg,#b71c1c,#c62828)}
.hud-rank{font-size:.55rem;font-weight:900;background:#ff6f00;color:white;border-radius:4px;padding:1px 4px;display:inline-block;margin-bottom:4px}
.hud-emoji{font-size:2.4rem;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.hud-name{font-size:.7rem;font-weight:700;margin:3px 0}
.hud-lv{font-size:.6rem;opacity:.8}
.hud-pos{background:rgba(255,255,255,.2);border-radius:4px;font-size:.6rem;font-weight:700;padding:1px 5px;display:inline-block;margin-bottom:4px}
.energy-wrap{background:rgba(0,0,0,.3);border-radius:4px;height:10px;margin-top:4px;overflow:hidden}
.energy-fill{height:100%;background:linear-gradient(90deg,#f9a825,#ffd54f);border-radius:4px;transition:width .4s}
.energy-txt{font-size:.55rem;color:rgba(255,255,255,.8);margin-top:2px}
.match-log{background:rgba(0,0,0,.4);border-radius:10px;padding:8px;color:white;font-size:.78rem;line-height:1.6;min-height:100px;max-height:120px;overflow-y:auto;text-align:center}
.match-footer{background:#1a1a2e;border-radius:0 0 14px 14px;padding:10px}
.tactics-row{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.tac-btn{padding:5px 14px;border:2px solid rgba(255,255,255,.3);border-radius:20px;background:transparent;color:rgba(255,255,255,.7);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s}
.tac-btn.active{background:white;color:#1a1a2e;border-color:white}
.action-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.act-btn{background:linear-gradient(160deg,#283593,#3949ab);color:white;border:none;border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.act-btn:hover{transform:translateY(-2px);filter:brightness(1.2)}
.act-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.act-btn .act-icon{font-size:1.3rem}
.act-btn .act-name{font-size:.62rem;font-weight:700;display:block;margin:2px 0}
.act-btn .act-cost{font-size:.6rem;color:#ffd54f}
.act-btn.special{background:linear-gradient(160deg,#b71c1c,#e53935)}
.fp-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.fp-label{color:#ffd700;font-size:.7rem;font-weight:700;white-space:nowrap}
.fp-track{flex:1;background:rgba(255,255,255,.15);border-radius:6px;height:12px;overflow:hidden}
.fp-fill{height:100%;background:linear-gradient(90deg,#f57f17,#ffd54f,#fff176);border-radius:6px;transition:width .5s}
.fp-btn{background:linear-gradient(135deg,#f57f17,#ffd54f);color:#1a1a1a;border:none;border-radius:8px;padding:5px 10px;font-weight:900;font-size:.72rem;cursor:pointer;white-space:nowrap;display:none}
.fp-btn.ready{display:block;animation:pulse .8s infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.3)}}

/* ── Dream Team ── */
.dt-section-title{font-size:1.3rem;font-weight:700;color:#6a1b9a;margin-bottom:16px;text-align:center}
.player-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.player-card{border:3px solid #e0e0e0;border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa}
.player-card:hover{border-color:#8e24aa;background:#f3e5f5;transform:translateY(-2px)}
.player-card.selected{border-color:#6a1b9a;background:#ede7f6;box-shadow:0 4px 14px rgba(106,27,154,.3)}
.player-card .pc-emoji{font-size:2.2rem}
.player-card .pc-name{font-weight:700;font-size:.9rem;margin-top:4px;color:#333}
.player-card .pc-role{font-size:.75rem;color:#777}
.pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:5px}
.stat{font-size:.6rem;font-weight:700;color:#555}
.stat span{color:#1565c0}
.stat-bar{height:3px;background:#e0e0e0;border-radius:2px;margin-top:1px}
.stat-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#1565c0,#42a5f5)}
.power-badge{background:linear-gradient(135deg,#f57f17,#fbc02d);color:#1a1a1a;border-radius:10px;padding:8px 16px;text-align:center;font-weight:700;font-size:1rem;margin-bottom:14px}
.score-bar{background:rgba(0,0,0,.75);border-radius:12px;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:white;font-weight:700;font-size:1.1rem}
.score-bar .team{font-size:.8rem;opacity:.8}
.score-num{font-size:2rem;color:#fbc02d}
.team-slots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;min-height:48px;padding:10px;background:#f3e5f5;border-radius:12px;border:2px dashed #ba68c8}
.team-slot{background:#6a1b9a;color:white;border-radius:8px;padding:5px 10px;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:5px}
.team-slot .remove{cursor:pointer;opacity:.7;font-size:.8rem}
.team-slot .remove:hover{opacity:1}
.slot-hint{color:#9c5fb5;font-size:.85rem;align-self:center}

/* ── Code Lesson ── */
.code-lesson{background:#1e1e2e;border-radius:14px;padding:20px 22px;margin-bottom:20px;position:relative}
.code-lesson h3{color:#cba6f7;font-size:1rem;margin-bottom:12px}
.code-line{font-family:monospace;font-size:.95rem;line-height:1.9;color:#cdd6f4;white-space:pre-wrap}
.code-line .hl-key{color:#89b4fa}
.code-line .hl-val{color:#a6e3a1}
.code-line .hl-str{color:#fab387}
.lesson-tip{margin-top:14px;background:#313244;border-radius:10px;padding:12px 14px;color:#cdd6f4;font-size:.88rem;line-height:1.6}
.lesson-tip strong{color:#f9e2af}
/* ── Jersey Builder ── */
.jersey-preview{display:flex;justify-content:center;margin:16px 0}
.jersey-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.ctrl-group{display:flex;flex-direction:column;gap:4px}
.ctrl-group label{font-size:.8rem;font-weight:700;color:#555}
.ctrl-group input[type=text],.ctrl-group input[type=number]{width:100%;padding:8px 10px;border:2px solid #e0e0e0;border-radius:8px;font-size:1rem;font-family:inherit}
.swatch-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.swatch{width:30px;height:30px;border-radius:6px;cursor:pointer;border:3px solid transparent;transition:transform .1s,border-color .1s;flex-shrink:0}
.swatch:hover{transform:scale(1.15)}
.swatch.active{border-color:#333;transform:scale(1.15)}
.swatch-white{border-color:#ccc}
.swatch-white.active{border-color:#333}
.pattern-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pat-btn{padding:7px 14px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;background:white;transition:all .15s}
.pat-btn.active{border-color:#6a1b9a;background:#ede7f6;color:#6a1b9a}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="game-container">
  <header>
    <h1>⚽ Captain Tsubasa Soccer in the Galaxy</h1>
    <p class="subtitle">Play the story — build your team — learn to code!</p>
  </header>
  <main id="game"></main>
  <footer><p>Open this file in any browser. No internet needed!</p></footer>
</div>
<script>

// ═══════════════════════════════════════════════════════════
//  PLAYERS  — each player is an object with name, emoji, role
// ═══════════════════════════════════════════════════════════
// spd=speed  sht=shoot  drb=dribble  pas=pass  (all out of 99)
const PLAYERS = [
  {id:"tsubasa",    name:"Tsubasa",    emoji:"⚽", role:"Forward",    move:"Drive Shot",            spd:92,sht:95,drb:90,pas:88},
  {id:"hyuga",      name:"Hyuga",      emoji:"🐯", role:"Forward",    move:"Tiger Shot",            spd:88,sht:98,drb:75,pas:65},
  {id:"oliver",     name:"Oliver",     emoji:"🌟", role:"Forward",    move:"Twin Shot",             spd:85,sht:88,drb:82,pas:80},
  {id:"santana",    name:"Santana",    emoji:"💪", role:"Forward",    move:"South American Dribble",spd:87,sht:85,drb:96,pas:72},
  {id:"sawada",     name:"Sawada",     emoji:"🌿", role:"Forward",    move:"Sliding Dash",          spd:80,sht:78,drb:75,pas:70},
  {id:"natureza",   name:"Natureza",   emoji:"🌺", role:"Forward",    move:"Samba Dribble",         spd:90,sht:82,drb:94,pas:76},
  {id:"misaki",     name:"Misaki",     emoji:"🎯", role:"Midfielder", move:"Perfect Pass",          spd:83,sht:72,drb:80,pas:97},
  {id:"schneider",  name:"Schneider",  emoji:"⚡", role:"Midfielder", move:"Sprint Blast",          spd:99,sht:88,drb:84,pas:78},
  {id:"urabe",      name:"Urabe",      emoji:"🎸", role:"Midfielder", move:"Skill Trick",           spd:76,sht:70,drb:88,pas:82},
  {id:"ishizaki",   name:"Ishizaki",   emoji:"🔥", role:"Midfielder", move:"Blazing Run",           spd:84,sht:74,drb:72,pas:76},
  {id:"pierre",     name:"Pierre",     emoji:"🥐", role:"Midfielder", move:"French Flair",          spd:78,sht:76,drb:86,pas:84},
  {id:"masao",      name:"Masao",      emoji:"👬", role:"Midfielder", move:"Twin Tackle",           spd:75,sht:68,drb:74,pas:79},
  {id:"kazuo",      name:"Kazuo",      emoji:"👫", role:"Midfielder", move:"Twin Charge",           spd:74,sht:67,drb:73,pas:78},
  {id:"misugi",     name:"Misugi",     emoji:"💫", role:"Midfielder", move:"Overhead Kick",         spd:70,sht:84,drb:85,pas:90},
  {id:"matsuyama",  name:"Matsuyama",  emoji:"🏔️", role:"Defender",   move:"Mountain Block",        spd:72,sht:60,drb:65,pas:70},
  {id:"soda",       name:"Soda",       emoji:"🌊", role:"Defender",   move:"Wave Tackle",           spd:76,sht:58,drb:62,pas:68},
  {id:"morisaki",   name:"Morisaki",   emoji:"🌙", role:"Defender",   move:"Shadow Guard",          spd:74,sht:55,drb:60,pas:72},
  {id:"kaltz",      name:"Kaltz",      emoji:"🏰", role:"Defender",   move:"Wall Defence",          spd:73,sht:62,drb:64,pas:74},
  {id:"napoleon",   name:"Napoleon",   emoji:"👑", role:"Defender",   move:"Royal Guard",           spd:71,sht:60,drb:63,pas:73},
  {id:"benji",      name:"Benji",      emoji:"🧤", role:"Goalkeeper", move:"Eagle Jump",            spd:80,sht:50,drb:55,pas:65},
  {id:"genzo",      name:"Genzo",      emoji:"🥅", role:"Goalkeeper", move:"Iron Fist",             spd:75,sht:48,drb:52,pas:62},
  {id:"wakashimazu",name:"Wakashimazu",emoji:"🦅", role:"Goalkeeper", move:"Hawk Dive",             spd:78,sht:49,drb:54,pas:63},
];

// ═══════════════════════════════════════════════════════════
//  STORY DATA
// ═══════════════════════════════════════════════════════════
const STORY = {
  start:{
    text:"You are Tsubasa Ozora, an 11-year-old soccer player from Nankatsu City. Today is the day of the big match against Shutetsu FC! Your team is counting on you. What do you do?",
    emoji:"⚽",
    choices:[
      {text:"Practice your Drive Shot on the field",next:"practice"},
      {text:"Talk to your teammate Oliver to plan tactics",next:"tactics"},
      {text:"Watch the rival team warm up",next:"scout"},
      {text:"Visit Genzo in goal to build team spirit",next:"genzo_talk"},
    ]
  },
  practice:{text:"You spend an hour perfecting your Drive Shot. The ball screams like a rocket! Coach Roberto nods. 'Your shot is strong, Tsubasa.' The match begins — 0-0. You get a free kick 30 metres out!",emoji:"🦵",choices:[{text:"Unleash the Drive Shot!",next:"drive_shot_win"},{text:"Pass to Oliver for a Twin Shot",next:"twin_shot"},{text:"Look up — Santana is rushing at you!",next:"santana_block"}]},
  drive_shot_win:{text:"BOOM! The ball smashes into the top corner! GOOOAL! The crowd goes wild! Nankatsu wins! YOU WIN!",emoji:"🏆",ending:"win"},
  twin_shot:{text:"You and Oliver kick at the same instant — the goalkeeper doesn't know which way to dive! DOUBLE GOAL! Nankatsu wins 2-0!",emoji:"🌟",ending:"win"},
  santana_block:{text:"The fearsome Santana charges at you! You have a split second to decide.",emoji:"😰",choices:[{text:"Shoot through him",next:"santana_shoot"},{text:"Dribble left around him",next:"santana_dribble"},{text:"Dummy — let Oliver in",next:"oliver_shoots"}]},
  santana_shoot:{text:"The ball deflects off Santana's shin and loops into the net! Lucky — but it counts! Nankatsu wins 1-0!",emoji:"🍀",ending:"win"},
  santana_dribble:{text:"You feint left — Santana goes the wrong way! You slide the ball into the corner. GOOOAL! Nankatsu wins!",emoji:"💨",ending:"win"},
  tactics:{text:"Oliver sketches a plan. 'Thumbs up means run into space.' In the match you spot Oliver give the signal!",emoji:"🤝",choices:[{text:"Sprint into space for the pass",next:"through_ball"},{text:"Fake the run — let Oliver shoot",next:"oliver_shoots"},{text:"Signal Oliver to make the run instead",next:"switch_roles"}]},
  through_ball:{text:"Oliver's pass lands perfectly at your feet! One-on-one with the keeper — you chip it over! GOOOAL! Nankatsu wins!",emoji:"🏅",ending:"win"},
  oliver_shoots:{text:"Three defenders chase you! Oliver is wide open and blasts it in! 'Great assist!' Oliver shouts. Nankatsu wins!",emoji:"🥇",ending:"win"},
  switch_roles:{text:"Oliver makes the run. He squares it back to you — completely free! You smash a volley into the roof of the net. GOOOAL!",emoji:"🔄",ending:"win"},
  scout:{text:"You notice the keeper always dives left! You tell Benji. Late in the game it's 1-1. You win a penalty!",emoji:"🔍",choices:[{text:"Shoot right — the keeper's weak side!",next:"penalty_win"},{text:"Blast it down the middle",next:"penalty_miss"},{text:"Let Benji take it",next:"benji_penalty"}]},
  penalty_win:{text:"You shoot right — the keeper dives left! The ball rolls into the empty net. Nankatsu wins 2-1! Heroes!",emoji:"🎉",ending:"win"},
  penalty_miss:{text:"The keeper catches it! 1-1. Extra time. Shutetsu scores. You lose 2-1. Roberto smiles: 'A loss teaches more than a win.'",emoji:"😤",ending:"lose"},
  benji_penalty:{text:"'I trust you,' you say. Benji curls it into the top corner! Nankatsu wins 2-1! A true team victory!",emoji:"🤜🤛",ending:"win"},
  genzo_talk:{text:"Genzo admits his hand is hurt. What do you do?",emoji:"🧤",choices:[{text:"Use it to your advantage",next:"genzo_exploit"},{text:"Tell your team to play fair",next:"genzo_fair"},{text:"Encourage him: 'Heart is stronger than hands'",next:"genzo_inspire"}]},
  genzo_exploit:{text:"You win 2-0 but no one celebrates. Roberto: 'We won the match but lost our honour.'",emoji:"😔",ending:"lose"},
  genzo_fair:{text:"You score a wonder goal from 40 metres. Genzo applauds. Nankatsu wins 1-0. A victory to be proud of!",emoji:"🤺",ending:"win"},
  genzo_inspire:{text:"Inspired, Genzo plays his best match — and so do you! 1-1. Penalty shootout. You score the winner. 'Rivals and friends.'",emoji:"🌅",ending:"win"},
};

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════
function statBar(val){return`<div class="stat-bar"><div class="stat-bar-fill" style="width:${val}%"></div></div>`;}
function playerCardHTML(p, selected, disabled){
  return`<div class="player-card${selected?" selected":""}${disabled?' style="opacity:.4;pointer-events:none"':''}" onclick="${disabled?"":"togglePlayer('"+p.id+"')"}">
    <div class="pc-emoji">${p.emoji}</div>
    <div class="pc-name">${p.name}</div>
    <div class="pc-role">${p.role}</div>
    <div class="pc-stats">
      <div class="stat">SPD <span>${p.spd}</span>${statBar(p.spd)}</div>
      <div class="stat">SHT <span>${p.sht}</span>${statBar(p.sht)}</div>
      <div class="stat">DRB <span>${p.drb}</span>${statBar(p.drb)}</div>
      <div class="stat">PAS <span>${p.pas}</span>${statBar(p.pas)}</div>
    </div>
  </div>`;}
function teamPower(list){ return list.length ? Math.round(list.reduce((s,p)=>(s+p.spd+p.sht+p.drb+p.pas),0)/list.length) : 0; }

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let myTeam  = [];   // starters — up to 11 players
let myBench = [];   // bench — up to 8 players
let score   = [0,0]; // [player, cpu]

// ═══════════════════════════════════════════════════════════

  const node = STORY[nodeId];
  if (!node) { renderHome(); return; }
  const isWin  = node.ending === "win";
  const isLose = node.ending === "lose";
  if (isWin)  score[0]++;
  if (isLose) score[1]++;
  set(`
    <div class="score-bar">
      <div><div class="team">Nankatsu</div><div class="score-num">${score[0]}</div></div>
      <div style="font-size:.85rem;opacity:.7">SCORE</div>
      <div style="text-align:right"><div class="team">Rivals</div><div class="score-num">${score[1]}</div></div>
    </div>
    <div class="card${isWin?" card-win":isLose?" card-lose":""}">
      <div class="emoji-big">${node.emoji}</div>
      <p class="story-text">${node.text}</p>
      ${node.ending ? `
        <div class="ending">
          ${isWin
            ? `<h2 class="win-title">🏆 GOAL! YOU WIN! 🏆</h2><p>You led Nankatsu to glory!</p>`
            : `<h2 class="lose-title">😤 Keep Training!</h2><p>Every champion loses. Try again!</p>`}
          <button class="btn btn-green" onclick="score=[0,0];renderHome()">▶ Back to Menu</button>

          `<button class="btn btn-blue" onclick="render('${c.next}')">${c.text}</button>`
        ).join("")}</div>`}
    </div>`);
}

function togglePlayer(id) {
  const inTeam  = myTeam.findIndex(x=>x.id===id);
  const inBench = myBench.findIndex(x=>x.id===id);

  if (myTeam.length < 11) { myTeam.push(PLAYERS.find(x=>x.id===id)); renderCreateTeam(); }

function renderMatch() {

function startDreamMatch(rivalName, rivalEmoji) {
  const rival = RIVALS.find(r=>r.name===rivalName) || RIVALS[0];
  const myStarters = myTeam.length ? myTeam : [PLAYERS[0]];
  M = {
    half:1, minute:0, score:[0,0],
    fp:0, tactics:"balance",
    myIdx:0, enIdx:0,
    myPlayers: myStarters.map(p=>({...p, energy:p.spd*10+200, maxE:p.spd*10+200})),
    enPlayers: rival.players,
    rival:{name:rivalName, emoji:rivalEmoji},
    log:["⚽ Kick off! Match starts!"],
    possession:"player",
  };
  drawMatch();
}

function drawMatch() {
  const mp = M.myPlayers[M.myIdx];
  const ep = M.enPlayers[M.enIdx % M.enPlayers.length];
  const myTeamName = myClub.name || "Japan";
  const minStr = M.minute+"'";
  const halfStr = M.half===1?"1st Half":"2nd Half";
  const myEpct  = Math.round(mp.energy/mp.maxE*100);
  const enEpct  = Math.round(ep.energy/ep.maxE*100);
  const fpPct   = Math.round(M.fp);
  const canShoot   = mp.energy >= 60;
  const canPass    = mp.energy >= 40;
  const canDribble = mp.energy >= 50;
  const canSpecial = mp.energy >= 100;

  set(`
    <div style="border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5)">

      <!-- HEADER -->
      <div class="match-header">
        <div style="font-size:.75rem">${myTeamName}<br><span style="opacity:.7">${halfStr}</span></div>
        <div style="text-align:center">
          <div class="match-score">${M.score[0]} - ${M.score[1]}</div>
          <div class="match-timer">⏱ ${minStr}</div>
        </div>
        <div style="font-size:.75rem;text-align:right">${M.rival.emoji} ${M.rival.name}</div>
      </div>

      <!-- BODY -->
      <div class="match-body">
        <!-- My player -->
        <div class="hud-card">
          <div class="hud-rank">UR</div>
          <div class="hud-emoji">${mp.emoji}</div>
          <div class="hud-name">${mp.name}</div>
          <div><span class="hud-pos">${mp.role}</span></div>
          <div class="hud-lv">Lv.99</div>
          <div class="energy-wrap"><div class="energy-fill" style="width:${myEpct}%"></div></div>
          <div class="energy-txt">⚡ ${mp.energy}/${mp.maxE}</div>
        </div>

        <!-- Match log -->
        <div class="match-log" id="mlog">${M.log.slice(-5).join("<br>")}</div>

        <!-- Enemy player -->
        <div class="hud-card enemy">
          <div class="hud-rank" style="background:#6a1b9a">UR</div>
          <div class="hud-emoji">${ep.emoji}</div>
          <div class="hud-name">${ep.name}</div>
          <div><span class="hud-pos">${ep.role}</span></div>
          <div class="hud-lv">Lv.99</div>
          <div class="energy-wrap"><div class="energy-fill" style="width:${enEpct}%;background:linear-gradient(90deg,#e53935,#ef9a9a)"></div></div>
          <div class="energy-txt">⚡ ${ep.energy}/${ep.maxE}</div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="match-footer">
        <!-- Tactics -->
        <div class="tactics-row">
          ${["defence","balance","offence"].map(t=>`<button class="tac-btn${M.tactics===t?" active":""}" onclick="M.tactics='${t}';drawMatch()">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join("")}
        </div>

        <!-- Actions -->
        <div class="action-row">
          <button class="act-btn" onclick="doAction('shoot')" ${canShoot?"":"disabled"}>
            <div class="act-icon">🦵</div>
            <span class="act-name">SHOOT</span>
            <div class="act-cost">⚡60 | PWR ${mp.sht*7}</div>
          </button>
          <button class="act-btn" onclick="doAction('pass')" ${canPass?"":"disabled"}>
            <div class="act-icon">🎯</div>
            <span class="act-name">PASS</span>
            <div class="act-cost">⚡40 | PWR ${mp.pas*7}</div>

          <button class="act-btn" onclick="doAction('dribble')" ${canDribble?"":"disabled"}>
            <div class="act-icon">💨</div>
            <span class="act-name">DRIBBLE</span>
            <div class="act-cost">⚡50 | PWR ${mp.drb*7}</div>
          </button>
          <button class="act-btn special" onclick="doAction('special')" ${canSpecial?"":"disabled"}>
            <div class="act-icon">🔥</div>
            <span class="act-name">SPECIAL</span>
            <div class="act-cost">⚡100</div>
          </button>
        </div>

        <!-- Full Power -->
        <div class="fp-row">
          <div class="fp-label">⚡FULL<br>POWER</div>
          <div class="fp-track"><div class="fp-fill" style="width:${fpPct}%"></div></div>
          <button class="fp-btn${M.fp>=100?" ready":""}" onclick="doAction('fullpower')">FULL<br>POWER!</button>
        </div>
      </div>
    </div>`);
}

function doAction(type) {
  const mp = M.myPlayers[M.myIdx];
  const ep = M.enPlayers[M.enIdx % M.enPlayers.length];
  const tacBonus = M.tactics==="offence"?1.2:M.tactics==="defence"?0.85:1;
  const tacDef   = M.tactics==="defence"?1.2:M.tactics==="offence"?0.85:1;
  M.minute = Math.min(90, M.minute + (5+Math.floor(Math.random()*5)));
  M.fp = Math.min(100, M.fp + 8);

  let msg="";
  if (type==="shoot") {
    mp.energy = Math.max(0, mp.energy-60);
    const pwr  = mp.sht * tacBonus * (0.8+Math.random()*0.5);
    const def  = ep.spd * tacDef   * (0.7+Math.random()*0.6);
    if (pwr > def) {
      M.score[0]++;
      M.fp = Math.min(100, M.fp+12);
      msg=`⚽ GOOOAL! ${mp.emoji} ${mp.name} scores with the ${mp.move}! ${M.score[0]}-${M.score[1]}`;
    } else {
      msg=`🧤 ${ep.emoji} ${ep.name} saves the shot!`;
    }
  } else if (type==="pass") {
    mp.energy = Math.max(0, mp.energy-40);
    const nxt = M.myPlayers[(M.myIdx+1)%M.myPlayers.length];
    M.myIdx = (M.myIdx+1)%M.myPlayers.length;
    msg=`🎯 ${mp.emoji} ${mp.name} passes to ${nxt.emoji} ${nxt.name}!`;
  } else if (type==="dribble") {
    mp.energy = Math.max(0, mp.energy-50);
    const pwr = mp.drb * tacBonus * (0.8+Math.random()*0.5);
    const def = ep.spd * (0.7+Math.random()*0.6);
    if (pwr > def) { msg=`💨 ${mp.emoji} ${mp.name} dribbles past the defender!`; }
    else { ep.energy=Math.max(0,ep.energy-80); msg=`🛡️ Defender tackles ${mp.name}! Tough challenge.`; }
  } else if (type==="special") {
    mp.energy = Math.max(0, mp.energy-100);
    M.fp = Math.min(100, M.fp+20);
    const pwr = Math.max(mp.sht,mp.drb,mp.spd) * 1.4 * (0.9+Math.random()*0.3);
    const def = ep.spd * (0.7+Math.random()*0.6);
    if (pwr > def) { M.score[0]++; msg=`🔥 SPECIAL MOVE! ${mp.emoji} ${mp.name} uses the ${mp.move}! GOAL! ${M.score[0]}-${M.score[1]}`; }
    else { msg=`💥 ${mp.emoji} ${mp.name} unleashes ${mp.move}... but it's blocked!`; }
  } else if (type==="fullpower") {
    M.fp=0;
    M.score[0]++;
    msg=`✨ FULL POWER! ${mp.emoji} ${mp.name} — UNSTOPPABLE! GOAL! ${M.score[0]}-${M.score[1]}`;
  }

  // Enemy counter
  if (Math.random() < 0.28 + (M.tactics==="defence"?-0.08:M.tactics==="offence"?0.08:0)) {
    M.score[1]++;
    msg += `<br>😨 ${ep.emoji} ${ep.name} counter-attacks! ${M.rival.name} scores! ${M.score[0]}-${M.score[1]}`;
  }

  M.log.push(msg);

  if (M.minute >= 45 && M.half===1) { M.half=2; M.minute=45; M.log.push("🔔 HALF TIME! 2nd half begins!"); }
  if (M.minute >= 90) { endMatch(); return; }
  drawMatch();
}

function endMatch() {
  const win = M.score[0]>M.score[1], draw=M.score[0]===M.score[1];
  set(`
    <div class="card${win?" card-win":draw?"":" card-lose"}">
      <div class="emoji-big">${win?"🏆":draw?"🤝":"😤"}</div>
      <h2 style="text-align:center;margin-bottom:8px">${win?"VICTORY!":draw?"DRAW!":"DEFEAT!"}</h2>

        <div><div class="team">${myClub.name||"Japan"}</div><div class="score-num">${M.score[0]}</div></div>

      </div>
      <div style="background:#f5f5f5;border-radius:12px;padding:12px;margin-bottom:14px;font-size:.85rem;line-height:2;max-height:200px;overflow-y:auto">
        ${M.log.join("<br>")}
      </div>
      <div class="choices">
        <button class="btn btn-gold" onclick="renderMatch()">⚽ Play Again</button>
        <button class="btn btn-green" onclick="renderHome()">← Menu</button>
      </div>
    </div>`);
}

  return `
    <div class="code-lesson">
      <h3>🧑‍💻 Your bench in code!</h3>
      <div class="code-line"><span class="hl-key">myBench</span> = [<br>${items}<br>]</div>
      <div class="lesson-tip">
        <strong>Two things to spot:</strong><br>
        <strong>[ ]</strong> = a <strong>LIST</strong> (array) — holds all ${myBench.length} bench player${myBench.length!==1?"s":""}!<br>
        <strong>{ }</strong> = an <strong>OBJECT</strong> — holds the facts about each player.<br>
        So this is a list of objects — coders use this all the time! 🎉

    </div>`;
}

  {hex:"#ff6f00",label:"Orange"},
  {hex:"#6a1b9a",label:"Purple"},
  {hex:"#00838f",label:"Teal"},
  {hex:"#ad1457",label:"Pink"},
  {hex:"#37474f",label:"Grey"},
  {hex:"#4a148c",label:"Violet"},
  {hex:"#1b5e20",label:"Dark Green"},
  {hex:"#b71c1c",label:"Dark Red"},
  {hex:"#0d47a1",label:"Dark Blue"},
  {hex:"#e8f5e9",label:"Light Green"},
];
const PATTERNS = ["solid","stripes","hoops","diagonal","half"];

function jerseyPattern(color1, color2, pattern) {
  switch(pattern) {
    case "stripes":   return `<defs><pattern id="jp" x="0" y="0" width="14" height="100" patternUnits="userSpaceOnUse"><rect width="7" height="100" fill="${color1}"/><rect x="7" width="7" height="100" fill="${color2}"/></pattern></defs><path d="M30 10 L10 30 L25 35 L25 110 L95 110 L95 35 L110 30 L90 10 L70 20 Q60 5 50 20 Z" fill="url(#jp)" stroke="${color2}" stroke-width="2"/>`;
    case "hoops":     return `<defs><pattern id="jp" x="0" y="0" width="100" height="16" patternUnits="userSpaceOnUse"><rect width="100" height="8" fill="${color1}"/><rect y="8" width="100" height="8" fill="${color2}"/></pattern></defs><path d="M30 10 L10 30 L25 35 L25 110 L95 110 L95 35 L110 30 L90 10 L70 20 Q60 5 50 20 Z" fill="url(#jp)" stroke="${color2}" stroke-width="2"/>`;
    case "diagonal":  return `<defs><pattern id="jp" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><line x1="0" y1="20" x2="20" y2="0" stroke="${color2}" stroke-width="7"/></pattern></defs><path d="M30 10 L10 30 L25 35 L25 110 L95 110 L95 35 L110 30 L90 10 L70 20 Q60 5 50 20 Z" fill="${color1}" stroke="${color2}" stroke-width="2"/><path d="M30 10 L10 30 L25 35 L25 110 L95 110 L95 35 L110 30 L90 10 L70 20 Q60 5 50 20 Z" fill="url(#jp)"/>`;
    case "half":      return `<path d="M30 10 L10 30 L25 35 L25 110 L60 110 L60 12 Q55 3 50 20 Z" fill="${color2}"/><path d="M60 12 L60 110 L95 110 L95 35 L110 30 L90 10 L70 20 Q65 3 60 12 Z" fill="${color1}"/>`;
    default:          return `<path d="M30 10 L10 30 L25 35 L25 110 L95 110 L95 35 L110 30 L90 10 L70 20 Q60 5 50 20 Z" fill="${color1}" stroke="${color2}" stroke-width="3"/>`;
  }
}

function jerseySVG(j) {
  const textColor = j.pattern==="half" ? j.color1 : j.color2;
  const outline   = j.pattern==="half" ? j.color2 : j.color1;
  return `<svg viewBox="0 0 120 120" width="180" height="180" xmlns="http://www.w3.org/2000/svg">
    ${jerseyPattern(j.color1, j.color2, j.pattern)}
    <path d="M30 10 L10 30 L25 35 L25 110 L95 110 L95 35 L110 30 L90 10 L70 20 Q60 5 50 20 Z" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/>
    <text x="60" y="72" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="26" font-weight="900" fill="${textColor}" stroke="${outline}" stroke-width="2">${j.num||"10"}</text>
    <text x="60" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="${textColor}" stroke="${outline}" stroke-width="1" letter-spacing="1">${(j.name||"PLAYER").toUpperCase().slice(0,10)}</text>
  </svg>`;
}

function swatches(field) {
  return COLOURS.map(c => {
    const isWhite = c.hex === "#ffffff";
    const active  = jersey[field] === c.hex;
    return `<div class="swatch${isWhite?" swatch-white":""}${active?" active":""}"
      style="background:${c.hex}"
      title="${c.label}"
      onclick="jersey.${field}='${c.hex}';renderJerseyBuilder()"></div>`;
  }).join("");
}

function renderJerseyBuilder() {
  set(`
    <div class="card card-dream">
      <div class="dt-section-title">👕 Create Your Own Jersey</div>
      <div class="jersey-preview" id="jpreview">${jerseySVG(jersey)}</div>

      <div class="ctrl-group" style="margin-bottom:12px">
        <label>🎨 Main Colour</label>
        <div class="swatch-row">${swatches("color1")}</div>
      </div>
      <div class="ctrl-group" style="margin-bottom:12px">
        <label>✨ Trim Colour</label>
        <div class="swatch-row">${swatches("color2")}</div>
      </div>

      <div class="jersey-controls">
        <div class="ctrl-group">
          <label>🔢 Number (1–99)</label>
          <input type="number" min="1" max="99" value="${jersey.num}" oninput="jersey.num=this.value;updateJersey()">
        </div>
        <div class="ctrl-group">
          <label>🏷️ Player Name</label>
          <input type="text" maxlength="10" value="${jersey.name}" oninput="jersey.name=this.value;updateJersey()">
        </div>
      </div>

      <div style="font-size:.8rem;font-weight:700;color:#555;margin-bottom:8px">👕 Pattern</div>
      <div class="pattern-row">
        ${PATTERNS.map(p=>`<button class="pat-btn${jersey.pattern===p?" active":""}" onclick="jersey.pattern='${p}';renderJerseyBuilder()">${p.charAt(0).toUpperCase()+p.slice(1)}</button>`).join("")}
      </div>
      <div class="choices">
        <button class="btn btn-purple" onclick="renderHome()">← Back to Menu</button>
      </div>
    </div>`);
}
function updateJersey() { document.getElementById("jpreview").innerHTML=jerseySVG(jersey); }

// ═══════════════════════════════════════════════════════════
//  TEAM NAME BUILDER
// ═══════════════════════════════════════════════════════════
const BADGES  = ["⚽","🌟","🔥","⚡","🦅","🐯","🦁","🐉","🌙","💫","🏆","🛡️","🌊","🌋","🎯","👑"];
const TCOLORS = [
  {hex:"#1565c0",label:"Blue"},{hex:"#e53935",label:"Red"},{hex:"#2e7d32",label:"Green"},
  {hex:"#f9a825",label:"Yellow"},{hex:"#6a1b9a",label:"Purple"},{hex:"#000000",label:"Black"},
  {hex:"#ff6f00",label:"Orange"},{hex:"#00838f",label:"Teal"},{hex:"#ad1457",label:"Pink"},
  {hex:"#37474f",label:"Grey"},{hex:"#ffffff",label:"White"},{hex:"#b71c1c",label:"Dark Red"},
];

function clubBadgeSVG(club) {
  const c = club.color;
  return `<svg viewBox="0 0 100 110" width="140" height="154" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 5 L90 20 L90 60 Q90 90 50 105 Q10 90 10 60 L10 20 Z" fill="${c}" stroke="white" stroke-width="3"/>
    <path d="M50 12 L84 25 L84 60 Q84 85 50 98 Q16 85 16 60 L16 25 Z" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
    <text x="50" y="58" text-anchor="middle" font-size="28">${club.badge}</text>
    <text x="50" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="white" letter-spacing="1">${club.name.toUpperCase().slice(0,12)}</text>
    <text x="50" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" fill="rgba(255,255,255,.75)">${club.city.toUpperCase().slice(0,14)}</text>
  </svg>`;
}

function renderTeamName() {
  set(`
    <div class="card card-dream">
      <div class="dt-section-title">🏟️ Create Your Team Name</div>
      <div class="jersey-preview" id="clubpreview">${clubBadgeSVG(myClub)}</div>

      <div class="jersey-controls" style="margin-bottom:14px">
        <div class="ctrl-group">
          <label>🏟️ Team Name</label>
          <input type="text" maxlength="16" value="${myClub.name}" oninput="myClub.name=this.value;updateClub()">
        </div>
        <div class="ctrl-group">
          <label>🌍 City / Country</label>
          <input type="text" maxlength="16" value="${myClub.city}" oninput="myClub.city=this.value;updateClub()">
        </div>
      </div>

      <div class="ctrl-group" style="margin-bottom:14px">
        <label>🎨 Badge Colour</label>
        <div class="swatch-row">${TCOLORS.map(c=>{
          const isWhite=c.hex==="#ffffff";
          const active=myClub.color===c.hex;
          return`<div class="swatch${isWhite?" swatch-white":""}${active?" active":""}" style="background:${c.hex}" title="${c.label}" onclick="myClub.color='${c.hex}';renderTeamName()"></div>`;
        }).join("")}</div>
      </div>

      <div class="ctrl-group" style="margin-bottom:18px">
        <label>🦅 Badge Symbol</label>
        <div class="swatch-row" style="gap:8px">${BADGES.map(b=>`
          <div style="width:36px;height:36px;border-radius:8px;border:3px solid ${myClub.badge===b?"#333":"#e0e0e0"};display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.4rem;background:${myClub.badge===b?"#ede7f6":"white"}" onclick="myClub.badge='${b}';renderTeamName()">${b}</div>`).join("")}
        </div>
      </div>

      <div style="background:linear-gradient(135deg,${myClub.color},${myClub.color}cc);color:white;border-radius:14px;padding:14px;text-align:center;margin-bottom:16px">
        <div style="font-size:1.5rem">${myClub.badge}</div>
        <div style="font-size:1.2rem;font-weight:900;letter-spacing:2px">${myClub.name||"My Team"}</div>
        <div style="font-size:.85rem;opacity:.85">${myClub.city||""}</div>
      </div>

      <div class="choices">
        <button class="btn btn-purple" onclick="renderHome()">← Back to Menu</button>
      </div>
    </div>`);
}
function updateClub(){ document.getElementById("clubpreview").innerHTML=clubBadgeSVG(myClub); }

// ── Galaxy background ──
(function(){
  const c=document.getElementById("stars"),ctx=c.getContext("2d");
  let stars=[];
  function resize(){c.width=innerWidth;c.height=innerHeight;stars=Array.from({length:220},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.6+.3,speed:Math.random()*.4+.1,twinkle:Math.random()*Math.PI*2,color:["#ffffff","#c4b5fd","#93c5fd","#f9a8d4"][Math.floor(Math.random()*4)]}));}
  resize();window.addEventListener("resize",resize);
  function draw(){ctx.clearRect(0,0,c.width,c.height);const t=Date.now()/1000;stars.forEach(s=>{const alpha=.5+.5*Math.sin(t*s.speed+s.twinkle);ctx.globalAlpha=alpha;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}
  draw();
})();

// ── Start ──
renderHome();
</script>
